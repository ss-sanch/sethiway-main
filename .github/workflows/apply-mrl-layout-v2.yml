name: Finalize MRL layout redesign

on:
  push:
    branches:
      - feature/sethiquant-mrl-layout-v1
    paths:
      - .github/workflows/apply-mrl-layout-v2.yml

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiquant-mrl-layout-v1

      - name: Replace Market Risk Lab markup
        shell: python
        run: |
          from pathlib import Path
          path = Path('sethiquant.html')
          html = path.read_text(encoding='utf-8')
          start_marker = '        <!-- MONTE CARLO VaR ENGINE -->'
          end_marker = '        <!-- QUANTITATIVE LEGAL DISCLAIMER -->'
          start = html.index(start_marker)
          end = html.index(end_marker)
          new_section = '''        <!-- MONTE CARLO VaR ENGINE -->
         <section id="section-var" class="scroll-mt-24 mb-12">
            <div class="max-w-[1800px] mx-auto pt-8 border-t border-gray-200 mb-4 flex flex-col lg:flex-row lg:items-center gap-4">
                <h2 class="text-2xl md:text-3xl font-black text-gray-900 uppercase tracking-tight shrink-0">Market Risk Lab</h2>
                <div class="bg-blue-50/40 border border-blue-100 rounded-xl px-5 py-3.5 shadow-sm flex-1">
                    <h4 class="text-xs font-bold text-blue-800 uppercase tracking-wider mb-1">Portfolio VaR & Expected Shortfall</h4>
                    <p class="text-sm text-gray-700 font-medium leading-relaxed">This engine simulates thousands of correlated market scenarios to project extreme portfolio losses. It calculates Value at Risk (VaR) to establish a baseline loss threshold, alongside Expected Shortfall (CVaR) to estimate the magnitude of severe tail-risk events.</p>
                </div>
            </div>
            <div id="market-risk-lab" class="max-w-[1800px] mx-auto grid grid-cols-1 xl:grid-cols-[300px_minmax(0,1fr)] gap-4 mb-10 items-start">
                <div class="bg-white border border-gray-200 rounded-2xl p-5 shadow-sm flex flex-col xl:sticky xl:top-20">
                    <h2 class="text-lg font-black text-gray-900 mb-3 border-b border-gray-100 pb-3">Portfolio Parameters</h2>
                    <form id="risk-form" class="space-y-3 flex-grow">
                        <div><label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">Portfolio Value (£)</label><input id="portfolio-value" type="number" value="100000" min="1" class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 font-bold outline-none focus:border-blue-500"></div>
                        <div class="grid grid-cols-2 gap-3">
                            <div><label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">Confidence</label><select id="confidence" class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 font-bold outline-none focus:border-blue-500"><option value="0.95">95%</option><option value="0.99" selected>99%</option></select></div>
                            <div><label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">Horizon</label><select id="horizon" class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 font-bold outline-none focus:border-blue-500"><option value="1">1 day</option><option value="10" selected>10 days</option><option value="30">30 days</option></select></div>
                        </div>
                        <div><label class="block text-[10px] font-black uppercase tracking-widest text-gray-500 mb-1">Lookback</label><select id="lookback" class="w-full border border-gray-200 rounded-lg px-3 py-2 bg-gray-50 font-bold outline-none focus:border-blue-500"><option value="1y">1 year</option><option value="2y" selected>2 years</option><option value="5y">5 years</option></select></div>
                        <div>
                            <div class="flex items-end justify-between mb-2 border-b border-gray-100 pb-2">
                                <div><label class="text-[10px] font-black uppercase tracking-widest text-gray-500">Positions</label><span class="text-[10px] text-gray-400 block mt-0.5">Must total 100%</span></div>
                                <button type="button" onclick="importMarkowitzWeights()" class="text-[10px] font-bold text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-2.5 py-1.5 rounded transition shadow-sm border border-indigo-100 flex items-center gap-1"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>Import Optimal</button>
                            </div>
                            <div id="positions" class="space-y-1.5"></div>
                        </div>
                        <button type="submit" id="run-btn" class="w-full py-2.5 mt-3 bg-blue-600 hover:bg-blue-700 text-white font-black rounded-lg shadow-sm transition">Run Risk Analysis</button>
                        <p id="risk-error" class="hidden text-sm text-red-600 font-semibold text-center mt-2"></p>
                    </form>
                </div>
                <div class="space-y-4 min-w-0">
                    <div class="grid grid-cols-2 lg:grid-cols-4 gap-3">
                        <div class="bg-gray-900 text-white rounded-xl p-4 shadow-lg relative overflow-hidden min-h-[96px]"><div class="absolute top-0 right-0 -mt-6 -mr-6 w-20 h-20 bg-blue-500 rounded-full opacity-20 blur-2xl"></div><div class="flex justify-between items-start z-10 relative"><p class="text-[10px] font-black text-gray-400 uppercase tracking-widest">MC 99% VaR</p><button type="button" onclick="toggleModal('modal-risk-metrics')" class="text-gray-400 hover:text-white transition cursor-pointer" title="Learn about VaR">ⓘ</button></div><h3 id="mc-var" class="text-3xl font-black mt-2 z-10 relative">£0</h3></div>
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm min-h-[96px]"><div class="flex justify-between items-start"><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest">MC Expected Shortfall</p><button type="button" onclick="toggleModal('modal-risk-metrics')" class="text-gray-400 hover:text-red-500 transition cursor-pointer" title="Learn about Expected Shortfall">ⓘ</button></div><h3 id="mc-es" class="text-3xl font-black text-red-600 mt-2">£0</h3></div>
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm min-h-[96px]"><div class="flex justify-between items-start"><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Historical VaR</p><button type="button" onclick="toggleModal('modal-risk-metrics')" class="text-gray-400 hover:text-blue-600 transition cursor-pointer" title="Learn about Historical VaR">ⓘ</button></div><h3 id="hist-var" class="text-3xl font-black mt-2">£0</h3></div>
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm min-h-[96px]"><div class="flex justify-between items-start"><p class="text-[10px] font-black text-gray-500 uppercase tracking-widest">Historical ES</p><button type="button" onclick="toggleModal('modal-risk-metrics')" class="text-gray-400 hover:text-blue-600 transition cursor-pointer" title="Learn about Historical ES">ⓘ</button></div><h3 id="hist-es" class="text-3xl font-black mt-2">£0</h3></div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 2xl:grid-cols-3 gap-4">
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm min-w-0"><div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-2"><div><h3 class="font-black text-lg text-gray-900">Model Comparison</h3><p class="text-xs text-gray-500">Same portfolio, different risk assumptions.</p></div><span id="model-gap" class="text-xs font-bold bg-gray-100 rounded-full px-3 py-1 text-gray-600">--</span></div><div id="model-chart" style="height:255px"></div></div>
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm min-w-0"><div class="border-b border-gray-100 pb-2 mb-2"><h3 class="font-black text-lg text-gray-900">MC P&amp;L Distribution</h3><p class="text-xs text-gray-500">Losses beyond the VaR threshold form the tail.</p></div><div id="pnl-chart" style="height:255px"></div></div>
                        <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm min-w-0 lg:col-span-2 2xl:col-span-1"><div class="flex items-center justify-between border-b border-gray-100 pb-2 mb-2"><div><h3 class="font-black text-lg text-gray-900">Asset Correlation Matrix</h3><p class="text-xs text-gray-500">Dependence structure for the Monte Carlo engine.</p></div><span id="obs-badge" class="text-xs text-gray-500 bg-gray-100 px-3 py-1 rounded-full">--</span></div><div id="corr-chart" style="height:255px"></div></div>
                    </div>
                </div>
            </div>
        </section>

'''
          html = html[:start] + new_section + html[end:]
          if '/* Market Risk Lab desktop-density pass */' not in html:
              css = '''        /* Market Risk Lab desktop-density pass */\n        #market-risk-lab input, #market-risk-lab select { min-height: 38px; }\n        #market-risk-lab #positions input { padding-top: 0.42rem; padding-bottom: 0.42rem; }\n        @media (min-width: 1536px) { #market-risk-lab { width: min(1800px, calc(100vw - 3rem)); } }\n'''
              html = html.replace('        html { scroll-behavior: smooth; }\n', '        html { scroll-behavior: smooth; }\n' + css, 1)
          path.write_text(html, encoding='utf-8')

      - name: Validate MRL structure
        shell: python
        run: |
          from pathlib import Path
          html = Path('sethiquant.html').read_text()
          section = html[html.index('<!-- MONTE CARLO VaR ENGINE -->'):html.index('<!-- QUANTITATIVE LEGAL DISCLAIMER -->')]
          required = ['max-w-[1800px]','xl:grid-cols-[300px_minmax(0,1fr)]','2xl:grid-cols-3','id="mc-var"','id="mc-es"','id="hist-var"','id="hist-es"','id="model-chart" style="height:255px"','id="pnl-chart" style="height:255px"','id="corr-chart" style="height:255px"','lg:col-span-2 2xl:col-span-1']
          missing = [x for x in required if x not in section]
          if missing: raise SystemExit(f'Missing markers: {missing}')
          if section.count('id="corr-chart"') != 1: raise SystemExit('Correlation chart duplicated')
          print('MRL structure validated.')

      - name: Commit redesign
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Market Risk Lab desktop redesign [skip ci]"
          git push origin HEAD:feature/sethiquant-mrl-layout-v1
