name: Compact SethiPortfolio above fold
on:
  push:
    branches:
      - feature/sethiportfolio-v1-dashboard
    paths:
      - scripts/compact_sethiportfolio_above_fold.py
      - .github/workflows/compact-sethiportfolio-above-fold.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-v1-dashboard
      - run: python scripts/compact_sethiportfolio_above_fold.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git diff --cached --quiet && exit 0
          git commit -m "Compact SethiPortfolio above fold [skip ci]"
          git push origin HEAD:feature/sethiportfolio-v1-dashboard
