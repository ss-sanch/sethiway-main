name: Debug SethiStock live load

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/debug-sethistock-live.yml'
      - 'sethiway-history.js'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend guard
        run: node --check sethiway-history.js
      - name: Time production endpoints in parallel
        shell: bash
        run: |
          set +e
          API='https://sethistock-api.onrender.com'
          probe() {
            name="$1"; path="$2"
            echo "===== $name $path =====" > "/tmp/${name}.log"
            curl -L -sS -o "/tmp/${name}.out" \
              --connect-timeout 12 --max-time 40 \
              -w 'http=%{http_code} connect=%{time_connect}s start=%{time_starttransfer}s total=%{time_total}s\n' \
              "$API$path" >> "/tmp/${name}.log" 2>&1
            rc=$?
            echo "curl_rc=$rc bytes=$(wc -c < /tmp/${name}.out 2>/dev/null || echo 0)" >> "/tmp/${name}.log"
            head -c 500 "/tmp/${name}.out" >> "/tmp/${name}.log" 2>/dev/null || true
            echo >> "/tmp/${name}.log"
          }
          probe root '/' &
          probe cache '/api/cache/status' &
          probe driver_store '/api/drivers/storage/status' &
          probe quote '/api/quote/AAPL' &
          probe chart '/api/chart/AAPL?period=1y&interval=1d' &
          probe stock '/api/stock/AAPL' &
          wait
          for name in root cache driver_store quote chart stock; do cat "/tmp/${name}.log"; done
          echo 'SETHISTOCK_DIAGNOSTIC_COMPLETE'
