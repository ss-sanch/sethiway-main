name: Debug SethiStock live load

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/debug-sethistock-live.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Time production endpoints
        shell: bash
        run: |
          set +e
          API='https://sethistock-api.onrender.com'
          for spec in \
            'root|/' \
            'quote|/api/quote/AAPL' \
            'chart|/api/chart/AAPL?period=1y&interval=1d' \
            'stock|/api/stock/AAPL'; do
            name="${spec%%|*}"
            path="${spec#*|}"
            echo "===== $name $path ====="
            curl -L -sS -o "/tmp/${name}.out" \
              --connect-timeout 15 --max-time 45 \
              -w 'http=%{http_code} connect=%{time_connect}s start=%{time_starttransfer}s total=%{time_total}s\n' \
              "$API$path"
            rc=$?
            echo "curl_rc=$rc bytes=$(wc -c < /tmp/${name}.out 2>/dev/null || echo 0)"
            head -c 300 "/tmp/${name}.out" 2>/dev/null || true
            echo
          done
