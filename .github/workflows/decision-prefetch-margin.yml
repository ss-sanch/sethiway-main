name: Decision Prefetch Margin
on:
  push:
    branches: [phase3-portfolio-lab-refactor]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-portfolio-lab-refactor
      - run: python .github/scripts/decision_prefetch_margin_patch.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          import re
          t=Path('sethiportfolio.html').read_text()
          assert "rootMargin:'400px 0px'" in t
          Path('/tmp/inline.js').write_text('\n'.join(re.findall(r'<script>(.*?)</script>', t, flags=re.S)))
          PY
          node --check /tmp/inline.js
      - run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.html
          git commit -m 'Tune Investment Decisions lazy prefetch distance'
          git push origin HEAD:phase3-portfolio-lab-refactor
