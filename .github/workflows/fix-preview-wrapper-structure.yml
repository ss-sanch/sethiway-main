name: Fix preview wrapper structure
on:
  push:
    branches:
      - feature/backtest-v2-polish
    paths:
      - scripts/fix_preview_wrapper_structure.py
      - .github/workflows/fix-preview-wrapper-structure.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/backtest-v2-polish
      - run: python scripts/fix_preview_wrapper_structure.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix preview wrapper structure [skip ci]"
          git push origin HEAD:feature/backtest-v2-polish
