name: Hub card shortcuts

on:
  push:
    branches: [hub-card-shortcuts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-card-shortcuts
      - name: Apply card shortcuts
        run: python .github/scripts/hub_card_shortcuts_patch.py
      - name: Validate shortcut targets
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          targets = [
              'sethimacro.html#job-market', 'sethimacro.html#inflation-rates', 'sethimacro.html#currencies',
              'sethistock.html#key-metrics', 'sethistock.html#research-labs', 'sethistock.html#valuation',
              'sethiportfolio.html#performance', 'sethiportfolio.html#portfolio-lab', 'sethiportfolio.html#decisions',
              'sethiquant.html#section-options', 'sethiquant.html#section-backtest', 'sethiquant.html#section-var',
          ]
          for target in targets:
              assert text.count(target) == 1, target
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit card shortcuts
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Turn hub feature chips into section shortcuts'
          git push origin HEAD:hub-card-shortcuts
