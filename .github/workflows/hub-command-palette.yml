name: Hub command palette

on:
  push:
    branches: [hub-command-palette]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-command-palette
      - name: Apply command palette
        run: python .github/scripts/hub_command_palette_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert text.count('id="command-palette"') == 1
          assert text.count('id="command-palette-input"') == 1
          assert text.count('function openCommandPalette()') == 1
          assert text.count('>Command Palette</h3>') == 1
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit command palette
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add keyboard command palette to hub'
          git push origin HEAD:hub-command-palette
