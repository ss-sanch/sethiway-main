name: Hub company autocomplete
on:
  push:
    branches: [hub-company-autocomplete]
    paths:
      - '.github/scripts/hub_company_autocomplete_patch.py'
      - '.github/workflows/hub-company-autocomplete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-company-autocomplete
      - name: Apply company autocomplete
        run: python .github/scripts/hub_company_autocomplete_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('id="launcher-suggestions"') == 1
          assert 'Company Search' in s
          assert '—' not in s
          scripts=re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit company autocomplete
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add company autocomplete to Quick Launch'
          git push
