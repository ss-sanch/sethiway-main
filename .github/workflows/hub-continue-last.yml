name: Hub continue last

on:
  push:
    branches: [hub-continue-last]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-continue-last
      - name: Apply continue-last feature
        run: python .github/scripts/hub_continue_last_patch.py
      - name: Validate homepage and shared history
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index = Path('index.html').read_text()
          assert index.count('id="hub-continue"') == 1
          assert index.count('function renderHubContinue()') == 1
          assert index.count('>Continue Shortcut</h3>') == 1
          assert '—' not in index
          for filename in ['sethimacro.html', 'sethistock.html', 'sethiportfolio.html', 'sethiquant.html']:
              text = Path(filename).read_text()
              assert text.count('<script src="sethiway-history.js"></script>') == 1, filename
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', index, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
          node --check sethiway-history.js
      - name: Commit continue-last feature
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sethiway-history.js sethimacro.html sethistock.html sethiportfolio.html sethiquant.html
          git commit -m 'Add continue where you left off shortcut'
          git push origin HEAD:hub-continue-last
