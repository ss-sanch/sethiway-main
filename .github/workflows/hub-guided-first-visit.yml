name: Hub guided first visit
on:
  push:
    branches: [hub-guided-first-visit]
    paths:
      - '.github/scripts/hub_guided_first_visit_patch.py'
      - '.github/workflows/hub-guided-first-visit.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-guided-first-visit
      - name: Apply guided first visit
        run: python .github/scripts/hub_guided_first_visit_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          assert s.count('id="first-visit-guide"') == 1
          assert s.count('data-guide-action=') == 3
          assert 'sethiwayFirstVisitGuideSeen' in s
          assert 'sethiquant.html#section-var' in s
          assert '—' not in s
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit guided first visit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add guided first visit to hub'
          git push
