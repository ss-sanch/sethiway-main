name: Hub interface previews
on:
  push:
    branches: [hub-interface-previews]
    paths:
      - '.github/scripts/hub_interface_previews_patch.py'
      - '.github/workflows/hub-interface-previews.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-interface-previews
      - name: Apply interface previews
        run: python .github/scripts/hub_interface_previews_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('index.html').read_text()
          for filename in ('sethimacro.jpg', 'sethistock.jpg', 'sethiportfolio.jpg', 'sethiquant.jpg'):
              path = Path('assets/previews') / filename
              assert path.exists() and path.stat().st_size > 5000
              assert s.count(f'assets/previews/{filename}') == 1
          assert s.count('group-hover:opacity-100') >= 4
          assert s.count('group-hover:opacity-0') >= 4
          assert '—' not in s
          scripts = re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit interface previews
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add hover interface previews to hub cards'
          git push
