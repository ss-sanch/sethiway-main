name: Hub mobile navigation
on:
  push:
    branches: [hub-mobile-navigation]
    paths:
      - '.github/scripts/hub_mobile_navigation_patch.py'
      - '.github/workflows/hub-mobile-navigation.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-mobile-navigation
      - name: Apply mobile navigation
        run: python .github/scripts/hub_mobile_navigation_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          assert s.count('id="mobile-nav-trigger"') == 1
          assert s.count('id="mobile-nav"') == 1
          assert 'Mobile Navigation' in s
          assert '—' not in s
          scripts=re.findall(r'<script>(.*?)</script>', s, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit mobile navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add mobile navigation to hub'
          git push
