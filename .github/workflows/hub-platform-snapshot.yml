name: Hub platform snapshot

on:
  push:
    branches: [hub-platform-snapshot]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-platform-snapshot
      - name: Apply platform snapshot
        run: python .github/scripts/hub_platform_snapshot_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert text.count('id="platform-snapshot"') == 1
          assert text.count('id="recent-updates-grid"') == 1
          assert text.count('function renderPlatformSnapshot()') == 1
          assert text.count('>Platform Snapshot</h3>') == 1
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit platform snapshot
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add dynamic platform snapshot to hub'
          git push origin HEAD:hub-platform-snapshot
