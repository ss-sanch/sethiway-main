name: Homepage polish

on:
  push:
    branches: [hub-redesign-h1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-redesign-h1
      - name: Apply homepage polish
        run: python .github/scripts/hub_polish_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert 'scroll-behavior: smooth' in text
          assert 'Move from market context to security research, allocation and risk.' not in text
          assert 'New · SethiPortfolio is now live' not in text
          assert 'SethiPortfolio is now live' in text
          assert '—' not in text
          assert text.count('w-[150px] shrink-0') == 4
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          if [ -s /tmp/index-inline.js ]; then node --check /tmp/index-inline.js; fi
      - name: Commit homepage polish
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Polish homepage navigation and workflow layout'
          git push origin HEAD:hub-redesign-h1
