name: Hub recent companies
on:
  push:
    branches: [hub-recent-companies]
    paths:
      - '.github/scripts/hub_recent_companies_patch.py'
      - '.github/workflows/hub-recent-companies.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-recent-companies
      - name: Apply recent companies
        run: python .github/scripts/hub_recent_companies_patch.py
      - name: Validate pages
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          index=Path('index.html').read_text()
          stock=Path('sethistock.html').read_text()
          assert index.count('id="hub-recent-companies"') == 1
          assert index.count('id="hub-recent-company-items"') == 1
          assert 'Recent Companies' in index
          assert stock.count('function rememberRecentSethiStockTicker') == 1
          assert stock.count('rememberRecentSethiStockTicker(state.ticker);') == 1
          assert '—' not in index
          scripts=re.findall(r'<script>(.*?)</script>', index, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          scripts2=re.findall(r'<script>(.*?)</script>', stock, flags=re.S)
          Path('/tmp/stock-inline.js').write_text('\n'.join(scripts2))
          PY
          node --check /tmp/index-inline.js
          node --check /tmp/stock-inline.js
      - name: Commit recent companies
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sethistock.html
          git commit -m 'Add recent companies to Quick Launch'
          git push
