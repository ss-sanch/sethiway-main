name: Hub recently added

on:
  push:
    branches: [hub-recently-added]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-recently-added
      - name: Apply recent updates section
        run: python .github/scripts/hub_recently_added_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert text.count('id="recently-added"') == 1
          assert text.count('>Quick Launch</h3>') == 1
          assert text.count('sethiportfolio.html#portfolio-lab') == 2
          assert text.count('sethiquant.html#section-var') == 2
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit recent updates section
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add compact recently added section to hub'
          git push origin HEAD:hub-recently-added
