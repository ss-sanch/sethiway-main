name: Hub sign in cleanup

on:
  push:
    branches: [hub-universal-launcher]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-universal-launcher
      - name: Apply homepage cleanup
        run: python .github/scripts/hub_signin_cleanup_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert 'Explore the Platform →' not in text
          assert 'Open SethiPortfolio →' not in text
          assert text.count('>Sign In</button>') == 1
          assert text.count('id="login-modal"') == 1
          assert text.count('id="admin-login-form"') == 1
          assert "localStorage.setItem('sethiway_vault_key', password)" in text
          assert "window.location.href = 'admin.html'" in text
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit homepage cleanup
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify hero and restore admin sign in'
          git push origin HEAD:hub-universal-launcher
