name: Hub universal launcher

on:
  push:
    branches: [hub-universal-launcher]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-universal-launcher
      - name: Apply launcher patch
        run: python .github/scripts/hub_universal_launcher_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert text.count('id="stock-launcher"') == 1
          assert 'Open in SethiStock' in text
          assert 'sethistock.html?ticker=${encodeURIComponent(ticker)}&source=hub' in text
          assert 'Enter a valid ticker symbol.' in text
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit launcher
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Add quick launch controls to SethiWay hub'
          git push origin HEAD:hub-universal-launcher
