name: Hub watchlist launcher

on:
  push:
    branches: [hub-watchlist-launcher]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-watchlist-launcher
      - name: Apply watchlist launcher
        run: python .github/scripts/hub_watchlist_launcher_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert text.count('id="hub-watchlist"') == 1
          assert text.count('id="hub-watchlist-items"') == 1
          assert text.count('function renderHubWatchlist()') == 1
          assert text.count('>Watchlist Shortcuts</h3>') == 1
          assert text.count('sethiWatchlist') >= 2
          assert text.count('>Quick Launch</h3>') == 1
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/index-inline.js
      - name: Commit watchlist launcher
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Surface SethiStock watchlist in Quick Launch'
          git push origin HEAD:hub-watchlist-launcher
