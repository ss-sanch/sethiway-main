name: Homepage workflow alignment

on:
  push:
    branches: [hub-redesign-h1]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hub-redesign-h1
      - name: Apply workflow alignment patch
        run: python .github/scripts/hub_workflow_alignment_patch.py
      - name: Validate homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text()
          assert 'How It Works' not in text
          assert 'SethiPortfolio Vault' in text
          assert 'PORTFOLIO.</span>' in text
          assert text.count('preserveAspectRatio="none" aria-hidden="true"') == 3
          assert '—' not in text
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          Path('/tmp/index-inline.js').write_text('\n'.join(scripts))
          PY
          if [ -s /tmp/index-inline.js ]; then node --check /tmp/index-inline.js; fi
      - name: Commit homepage alignment
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Align homepage workflow arrows and simplify nav'
          git push origin HEAD:hub-redesign-h1
