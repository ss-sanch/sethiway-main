name: Layout SethiPortfolio hero grid
on:
  push:
    branches:
      - feature/sethiportfolio-v1-dashboard
    paths:
      - scripts/layout_sethiportfolio_hero_grid.py
      - .github/workflows/layout-sethiportfolio-hero-grid.yml
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-v1-dashboard
      - run: python scripts/layout_sethiportfolio_hero_grid.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git diff --cached --quiet && exit 0
          git commit -m "Rework SethiPortfolio hero grid [skip ci]"
          git push origin HEAD:feature/sethiportfolio-v1-dashboard
