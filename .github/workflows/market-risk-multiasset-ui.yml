name: Market Risk Multiasset UI Patch

on:
  push:
    branches: [market-risk-multiasset-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: market-risk-multiasset-ui

      - name: Make imported portfolios usable in Market Risk Lab
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          path = Path('sethiquant.html')
          text = path.read_text()

          replacements = [
              (
                  '<div id="positions" class="space-y-1.5"></div>',
                  '<div id="positions" class="space-y-1.5 max-h-72 overflow-y-auto pr-1"></div>',
                  'scrollable positions list',
              ),
              (
                  '''        function renderPositions(posArray) {\n            document.getElementById('positions').innerHTML = posArray.map((p, i) => `''',
                  '''        function renderPositions(posArray) {\n            document.getElementById('positions').innerHTML = posArray.map((p, i) => `''',
                  'render positions anchor',
              ),
              (
                  '''            const totalWeight = positions.reduce((sum, p) => sum + p.weight, 0);\n            if (Math.abs(totalWeight - 1) > 0.005) {''',
                  '''            if (positions.length < 2 || positions.length > 50) {\n                error.innerText = `Market Risk Lab supports between 2 and 50 assets. Current portfolio: ${positions.length}.`;\n                error.classList.remove('hidden');\n                return;\n            }\n\n            const totalWeight = positions.reduce((sum, p) => sum + p.weight, 0);\n            if (Math.abs(totalWeight - 1) > 0.005) {''',
                  'client asset bound',
              ),
          ]

          for old, new, label in replacements:
              if old == new:
                  continue
              if new in text and old not in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          path.write_text(text)

          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script)
                  temp = f.name
              subprocess.run(['node', '--check', temp], check=True)
          PY

          grep -q 'max-h-72 overflow-y-auto' sethiquant.html
          grep -q 'positions.length > 50' sethiquant.html

      - name: Commit frontend patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git commit -m "Support larger imported risk portfolios in UI"
          git push origin market-risk-multiasset-ui
