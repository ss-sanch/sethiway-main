name: Patch admin ledger client
on:
  push:
    branches: [feature/sethiportfolio-allocation-correction-ui]
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-allocation-correction-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_admin_ledger_client.py
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Use explicit admin ledger route [skip ci]"
          git push
