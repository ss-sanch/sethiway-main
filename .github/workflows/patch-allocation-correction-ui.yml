name: Patch allocation correction UI
on:
  push:
    branches: [feature/sethiportfolio-allocation-correction-ui]
    paths:
      - scripts/patch_allocation_correction_ui.py
      - .github/workflows/patch-allocation-correction-ui.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-allocation-correction-ui
      - run: python scripts/patch_allocation_correction_ui.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Add SethiPortfolio paired allocation correction UI [skip ci]"
          git push origin HEAD:feature/sethiportfolio-allocation-correction-ui
