name: Patch allocation FX autofill
on:
  push:
    branches: [feature/sethiportfolio-active-allocation-ui]
    paths:
      - scripts/patch_allocation_fx_autofill.py
      - .github/workflows/patch-allocation-fx-autofill.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-active-allocation-ui
      - run: python scripts/patch_allocation_fx_autofill.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Autofill historical FX for active allocations [skip ci]"
          git push origin HEAD:feature/sethiportfolio-active-allocation-ui
