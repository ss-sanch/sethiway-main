name: Patch foreign funding FX UI
on:
  push:
    branches: [feature/sethiportfolio-foreign-funding-fx-ui]
    paths:
      - 'scripts/patch_foreign_funding_fx_ui.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-foreign-funding-fx-ui
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/patch_foreign_funding_fx_ui.py
      - name: Sanity-check IDs and payload fields
        run: |
          grep -q 'allocation-funding-fx' sethiportfolio-admin.html
          grep -q 'funding_fx_rate_to_base' sethiportfolio-admin.html
      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Support foreign-currency funding in admin allocator [skip ci]"
          git push
