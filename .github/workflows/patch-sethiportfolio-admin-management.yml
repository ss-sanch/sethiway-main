name: Patch SethiPortfolio Admin Management
on:
  push:
    branches:
      - feature/sethiportfolio-admin-management
    paths:
      - scripts/patch_sethiportfolio_admin_management.py
      - .github/workflows/patch-sethiportfolio-admin-management.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-admin-management
      - run: python scripts/patch_sethiportfolio_admin_management.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sethiportfolio-admin.html').read_text(encoding='utf-8')
          assert 'Manage Journal Entries' in s
          assert 'Correct trade' in s
          assert 'correction-modal' in s
          assert "method = editingJournalId ? 'PATCH' : 'POST'" in s
          assert "method:'DELETE'" in s
          print('Phase 2E frontend validation passed')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio-admin.html
          git diff --cached --quiet && exit 0
          git commit -m "Add SethiPortfolio journal management and trade correction UI [skip ci]"
          git push origin HEAD:feature/sethiportfolio-admin-management
