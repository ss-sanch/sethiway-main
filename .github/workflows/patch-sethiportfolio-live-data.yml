name: Patch SethiPortfolio Live Data
on:
  push:
    branches:
      - feature/sethiportfolio-live-data
    paths:
      - scripts/patch_sethiportfolio_live_data.py
      - .github/workflows/patch-sethiportfolio-live-data.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiportfolio-live-data
      - run: python scripts/patch_sethiportfolio_live_data.py
      - run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('sethiportfolio.html').read_text()
          assert 'Illustrative V1 Data' not in s
          assert 'Live Portfolio Data' in s
          assert "const API_BASE = 'https://sethistock-api.onrender.com/api/portfolio';" in s
          assert 'QQQ' in s and '^SP500TR' in s and 'VWRL.L' in s
          assert 'Avg Cost' in s and 'Unrealised P&amp;L' in s
          assert 'loadPortfolio();' in s
          print('SethiPortfolio live-data validation passed')
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git diff --cached --quiet && exit 0
          git commit -m "Connect SethiPortfolio dashboard to live API [skip ci]"
          git push origin HEAD:feature/sethiportfolio-live-data
