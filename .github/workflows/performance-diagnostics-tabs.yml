name: Performance Diagnostics Tabs

on:
  push:
    branches: [phase3-portfolio-lab-refactor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-portfolio-lab-refactor
      - name: Apply Performance Diagnostics tabs patch
        run: python .github/scripts/performance_diagnostics_tabs_patch.py
      - name: Validate JavaScript and diagnostic tabs
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/sethiportfolio-inline.js').write_text('\n'.join(scripts))
          assert 'performanceDiagnosticMap' in text
          assert 'data-performance-diagnostic="attribution"' in text
          assert 'data-performance-diagnostic="benchmark"' in text
          assert 'data-performance-diagnostic="drawdown"' in text
          assert 'data-performance-diagnostic="efficiency"' in text
          assert 'performance-diagnostic-panel[hidden]' in text
          assert "currentPerformanceDiagnostic === 'benchmark'" in text
          assert "currentPerformanceDiagnostic === 'drawdown'" in text
          assert "currentPerformanceDiagnostic === 'efficiency'" in text
          print('Performance Diagnostics tabs validated')
          PY
          node --check /tmp/sethiportfolio-inline.js
      - name: Commit Performance Diagnostics tabs
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.html
          git commit -m 'Split Performance Diagnostics into focused subviews'
          git push origin HEAD:phase3-portfolio-lab-refactor
