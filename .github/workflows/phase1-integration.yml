name: Phase 1 Integration Runner

on:
  push:
    branches: [phase1-integration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-integration

      - name: Apply integration patch
        run: python .github/scripts/phase1_patch.py

      - name: Commit integration changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html sethistock.html sethiquant.html
          git commit -m "Integrate SethiPortfolio with SethiStock and SethiQuant"
          git push origin phase1-integration
