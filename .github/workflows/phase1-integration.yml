name: Apply Phase 1 Integration

on:
  push:
    branches:
      - phase1-integration

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-integration

      - name: Apply SethiWay integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected 1 match in {path}, found {count}")
              p.write_text(text.replace(old, new, 1))

          # -------------------------
          # SETHIPORTFOLIO
          # -------------------------
          replace_once(
              'sethiportfolio.html',
              '''            <a href="index.html" class="px-4 py-2.5 bg-gray-900 text-white text-sm font-bold rounded-lg hover:bg-gray-800 transition shadow-sm shrink-0">Back to Hub</a>''',
              '''            <div class="flex items-center gap-2 shrink-0">
                <a href="sethiportfolio-admin.html" class="px-3 py-2.5 border border-gray-200 bg-white text-gray-700 text-sm font-bold rounded-lg hover:border-blue-300 hover:text-blue-700 hover:bg-blue-50 transition shadow-sm" title="Open the protected SethiPortfolio control panel">Portfolio Admin</a>
                <a href="index.html" class="px-4 py-2.5 bg-gray-900 text-white text-sm font-bold rounded-lg hover:bg-gray-800 transition shadow-sm">Back to Hub</a>
            </div>''',
              'portfolio admin nav'
          )

          replace_once(
              'sethiportfolio.html',
              '''                    <button class="text-xs font-black text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg px-4 py-2 opacity-60 cursor-not-allowed" title="Planned integration">Analyse in SethiQuant · Coming later</button>''',
              '''                    <a href="sethiquant.html?portfolio=fundamental&source=sethiportfolio#section-var" class="text-xs font-black text-indigo-700 bg-indigo-50 border border-indigo-100 rounded-lg px-4 py-2 hover:bg-indigo-100 hover:border-indigo-200 transition" title="Load the live portfolio into SethiQuant's Market Risk Lab">Analyse Portfolio in SethiQuant →</a>''',
              'portfolio quant CTA'
          )

          replace_once(
              'sethiportfolio.html',
              '''                <td class="px-5 py-4"><div class="font-black text-gray-900">${h.name}</div><div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider">${h.symbol} · ${h.quantity.toLocaleString('en-GB')} units</div></td>''',
              '''                <td class="px-5 py-4"><a href="sethistock.html?ticker=${encodeURIComponent(h.symbol)}&source=portfolio" class="group inline-block" title="Analyse ${h.symbol} in SethiStock"><div class="font-black text-gray-900 group-hover:text-blue-700 transition">${h.name} <span class="text-blue-600 opacity-0 group-hover:opacity-100 transition">↗</span></div><div class="text-[10px] font-bold text-gray-400 uppercase tracking-wider group-hover:text-blue-600 transition">${h.symbol} · ${h.quantity.toLocaleString('en-GB')} units · Analyse in SethiStock</div></a></td>''',
              'portfolio stock deep link'
          )

          # -------------------------
          # SETHISTOCK
          # -------------------------
          replace_once(
              'sethistock.html',
              '''        renderWatchlist();

        function toggleModal(id) {''',
              '''        renderWatchlist();

        function initialiseSethiwayDeepLink() {
            const params = new URLSearchParams(window.location.search);
            const ticker = (params.get('ticker') || '').trim().toUpperCase();
            if (!ticker) return;
            const input = document.getElementById('ticker-input');
            const form = document.getElementById('search-form');
            input.value = ticker;
            requestAnimationFrame(() => {
                if (typeof form.requestSubmit === 'function') form.requestSubmit();
                else document.getElementById('search-btn').click();
            });
        }

        initialiseSethiwayDeepLink();

        function toggleModal(id) {''',
              'sethistock deep-link loader'
          )

          # -------------------------
          # SETHIQUANT
          # -------------------------
          replace_once(
              'sethiquant.html',
              '''            <a href="sethimacro.html" class="hover:text-blue-600 transition">SethiMacro</a>
            <a href="index.html" class="px-5 py-2.5 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition shadow-md">Back to Hub</a>''',
              '''            <a href="sethimacro.html" class="hover:text-blue-600 transition">SethiMacro</a>
            <a href="sethiportfolio.html" class="hover:text-blue-600 transition">SethiPortfolio</a>
            <a href="index.html" class="px-5 py-2.5 bg-gray-900 text-white rounded-lg hover:bg-gray-800 transition shadow-md">Back to Hub</a>''',
              'sethiquant portfolio nav'
          )

          replace_once(
              'sethiquant.html',
              '''        // Initial render on page load
        renderPositions(activePositions);

        function formatMoney(v) {''',
              '''        // Initial render on page load
        renderPositions(activePositions);

        async function importPortfolioFromQuery() {
            const params = new URLSearchParams(window.location.search);
            const slug = (params.get('portfolio') || '').trim();
            if (!slug) return;

            const form = document.getElementById('risk-form');
            const banner = document.createElement('div');
            banner.id = 'portfolio-import-banner';
            banner.className = 'mb-3 rounded-xl border border-blue-100 bg-blue-50 px-3 py-2.5 text-[11px] font-bold text-blue-800 leading-relaxed';
            banner.textContent = 'Importing live SethiPortfolio positions…';
            form.parentNode.insertBefore(banner, form);

            try {
                const res = await fetch(`https://sethistock-api.onrender.com/api/portfolio/${encodeURIComponent(slug)}`);
                if (!res.ok) throw new Error(`Portfolio request failed (${res.status})`);
                const payload = await res.json();
                const snapshot = payload.snapshot || {};
                const holdings = (snapshot.holdings || []).filter(h => h.symbol && Number(h.weight_pct) > 0);
                if (!holdings.length) throw new Error('No live holdings were returned.');

                const investedWeight = holdings.reduce((sum, h) => sum + Number(h.weight_pct || 0), 0);
                if (!(investedWeight > 0)) throw new Error('Portfolio weights are unavailable.');

                activePositions = holdings.map(h => [
                    String(h.symbol).toUpperCase(),
                    Number(((Number(h.weight_pct) / investedWeight) * 100).toFixed(4))
                ]);
                renderPositions(activePositions);

                const riskyCapital = Number(snapshot.portfolio_value || 0) * investedWeight / 100;
                const valueInput = document.getElementById('portfolio-value');
                if (Number.isFinite(riskyCapital) && riskyCapital > 0) valueInput.value = Math.round(riskyCapital);

                const cashWeight = Math.max(0, Number(snapshot.cash_weight_pct || 0));
                banner.innerHTML = `<strong>Imported from SethiPortfolio:</strong> ${holdings.length} live holding${holdings.length === 1 ? '' : 's'} loaded into the Market Risk Lab.${cashWeight > 0.01 ? ` Cash (${cashWeight.toFixed(1)}%) is excluded and risky holdings are re-normalised to 100%.` : ''}`;
                banner.className = 'mb-3 rounded-xl border border-emerald-100 bg-emerald-50 px-3 py-2.5 text-[11px] font-bold text-emerald-800 leading-relaxed';
            } catch (error) {
                console.error('SethiPortfolio import failed:', error);
                banner.textContent = `SethiPortfolio import failed: ${error.message}`;
                banner.className = 'mb-3 rounded-xl border border-red-100 bg-red-50 px-3 py-2.5 text-[11px] font-bold text-red-700 leading-relaxed';
            }
        }

        importPortfolioFromQuery();

        function formatMoney(v) {''',
              'sethiquant portfolio import'
          )

          print('Phase 1 integration patch applied.')
          PY

      - name: Commit integration changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No integration changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html sethistock.html sethiquant.html
          git commit -m "Integrate SethiPortfolio with SethiStock and SethiQuant"
          git push origin phase1-integration
