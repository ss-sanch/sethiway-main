name: Phase 1 Review Hotfix

on:
  push:
    branches: [phase1-hotfix-review]

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-hotfix-review

      - name: Apply review fixes and validate JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if new in text and old not in text:
                  return
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'sethiquant.html',
              '''<input id="weight-${i}" type="number" value="${p[1]}" min="0.1" max="100" step="0.1"''',
              '''<input id="weight-${i}" type="number" value="${p[1]}" min="0.0001" max="100" step="0.0001"''',
              'risk weight precision'
          )

          replace_once(
              'sethistock.html',
              "document.getElementById('ticker-input').value = data.ticker;",
              "state.ticker = String(data.ticker || state.ticker).toUpperCase();\n                document.getElementById('ticker-input').value = state.ticker;",
              'canonical ticker state'
          )

          for page in ['sethiquant.html', 'sethistock.html']:
              text = Path(page).read_text()
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
              for script in scripts:
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                      f.write(script)
                      temp = f.name
                  subprocess.run(['node', '--check', temp], check=True)

          print('Phase 1 review hotfix validated.')
          PY

      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Hotfix already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html sethistock.html
          git commit -m "Fix Phase 1 integration review issues"
          git push origin phase1-hotfix-review
