name: Phase 1 Integration Pass 2

on:
  push:
    branches: [phase1-integration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-integration

      - name: Apply and validate Phase 1 pass 2
        shell: bash
        run: |
          set +e
          python .github/scripts/phase1_patch2.py 2>/tmp/phase1-pass2.err
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            cat /tmp/phase1-pass2.err
            grep -q "admin apply inbound intent after login" /tmp/phase1-pass2.err || exit "$status"
          fi
          python .github/scripts/phase1_patch2_fix.py

      - name: Commit Phase 1 pass 2
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html sethistock.html sethiportfolio-admin.html sethiquant.html
          git commit -m "Add shared watchlist and SethiStock portfolio handoff"
          git push origin phase1-integration
