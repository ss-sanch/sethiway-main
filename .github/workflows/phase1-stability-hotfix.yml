name: Phase 1 Frontend Stability Hotfix

on:
  push:
    branches:
      - phase1-stability-hotfix

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1-stability-hotfix
      - name: Apply frontend stability patch
        run: python .phase1_frontend_stability_patch.py
      - name: Validate patched HTML and JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path('sethistock.html').read_text()
          required = [
              'fetchJsonWithRetry',
              'normaliseChartData',
              'chartAbortController',
              'chartMemoryCache',
              "Plotly.react('price-chart'",
              'Detailed analysis could not reach the data server',
          ]
          for token in required:
              assert token in html, token
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', html, flags=re.S|re.I)
          Path('/tmp/sethistock-inline.js').write_text('\n'.join(blocks))
          print('HTML_STATIC_OK')
          PY
          node --check /tmp/sethistock-inline.js
      - name: Commit frontend hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sethistock.html
          git commit -m "Stabilise SethiStock chart and API requests"
          git push
