name: Phase 1A Lightweight Peers Frontend

on:
  push:
    branches:
      - phase1a-lightweight-peers

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1a-lightweight-peers

      - name: Patch SethiStock peer fetch
        env:
          PATCH_B64: 
        run: echo "$PATCH_B64" | base64 -d | python

      - name: Validate peer endpoint wiring
        run: |
          grep -q '/api/peers?tickers=' sethistock.html
          ! grep -q 'is_peer=true' sethistock.html

      - name: Commit frontend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethistock.html
          git diff --cached --quiet && exit 0
          git commit -m "Use lightweight peer snapshot API in SethiStock"
          git push
