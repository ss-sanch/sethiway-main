name: Phase 1C Frontend

on:
  push:
    branches:
      - phase1c-progressive-loading

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1c-progressive-loading

      - name: Enable progressive SethiStock loading
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sethistock.html')
          text = path.read_text(encoding='utf-8')

          old = '''            try {
                          const res = await fetch(`${API_URL}/api/stock/${state.ticker}`);
                          const data = await res.json();
                          if (!res.ok) throw new Error(data.detail);

                          // Smart Search: Update input to show the actual verified ticker found
          '''
          new = '''            try {
                          const requestedTicker = state.ticker;

                          // Stage 1 starts immediately: chart + lightweight quote.
                          // The full analysis continues in parallel and hydrates the heavier sections when ready.
                          const chartPromise = fetchChart().catch(() => null);
                          const fullDataPromise = fetch(`${API_URL}/api/stock/${requestedTicker}`).then(async (res) => {
                              const payload = await res.json();
                              if (!res.ok) throw new Error(payload.detail || 'Failed to load stock analysis.');
                              return payload;
                          });
                          const quoteDataPromise = fetch(`${API_URL}/api/quote/${requestedTicker}`)
                              .then(async (res) => res.ok ? await res.json() : null)
                              .catch(() => null);

                          const quoteData = await Promise.race([
                              quoteDataPromise,
                              new Promise(resolve => setTimeout(() => resolve(null), 6000))
                          ]);

                          if (quoteData) {
                              state.ticker = String(quoteData.ticker || requestedTicker).toUpperCase();
                              state.price = Number(quoteData.current_price || 0);
                              document.getElementById('ticker-input').value = state.ticker;
                              document.getElementById('display-ticker').innerText = state.ticker;
                              document.getElementById('display-price').innerText = `$${state.price.toFixed(2)}`;

                              const quoteChange = Number(quoteData.change || 0);
                              const quotePct = Number(quoteData.pct_change || 0);
                              const changeEl = document.getElementById('display-change');
                              const pctEl = document.getElementById('display-pct');
                              changeEl.innerText = quoteChange > 0 ? `+${quoteChange.toFixed(2)}` : quoteChange.toFixed(2);
                              pctEl.innerText = quoteChange > 0 ? `+${quotePct.toFixed(2)}%` : `${quotePct.toFixed(2)}%`;
                              changeEl.className = quoteChange >= 0 ? "text-xl font-semibold text-green-600" : "text-xl font-semibold text-red-600";
                              pctEl.className = quoteChange >= 0 ? "px-3 py-1 text-sm font-bold text-white rounded-full bg-green-500" : "px-3 py-1 text-sm font-bold text-white rounded-full bg-red-500";
                              injectText('stat-mkt', quoteData.market_cap || 'N/A');

                              progress = Math.max(progress, 35);
                              if (progBar) progBar.style.width = `${progress}%`;
                              if (loadingBubbleText) loadingBubbleText.innerText = 'Price loaded — building full analysis...';
                              updateWatchlistBtn();
                          }

                          const data = await fullDataPromise;

                          // Smart Search: Update input to show the actual verified ticker found
          '''
          if old not in text:
              raise SystemExit('Main stock fetch block not found.')
          text = text.replace(old, new, 1)

          old_chart = '''                setTimeout(async () => {
                              await fetchChart();
                              drawFinancials(cleanFin);
          '''
          new_chart = '''                setTimeout(async () => {
                              await chartPromise;
                              if (!state.chartData) await fetchChart().catch(() => null);
                              drawFinancials(cleanFin);
          '''
          if old_chart not in text:
              raise SystemExit('Deferred chart block not found.')
          text = text.replace(old_chart, new_chart, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate browser script syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('sethistock.html').read_text(encoding='utf-8')
          assert '/api/quote/${requestedTicker}' in text
          assert 'const fullDataPromise' in text
          assert "Price loaded — building full analysis..." in text
          assert 'await chartPromise;' in text
          start = text.index('<script>\n        const API_URL') + len('<script>')
          end = text.index('</script>', start)
          Path('/tmp/sethistock-main.js').write_text(text[start:end], encoding='utf-8')
          print('Progressive loading wiring found.')
          PY
          node --check /tmp/sethistock-main.js

      - name: Commit frontend change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethistock.html
          git diff --cached --quiet && exit 0
          git commit -m "Load SethiStock quote and chart before full analysis"
          git push
