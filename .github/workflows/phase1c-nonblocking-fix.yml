name: Phase 1C Nonblocking Fix

on:
  push:
    branches:
      - phase1c-progressive-loading

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase1c-progressive-loading
      - name: Apply patch
        run: python .phase1c_nonblocking_patch.py
      - name: Validate script
        run: |
          python -c "from pathlib import Path; t=Path('sethistock.html').read_text(); assert 'const quoteHydrationPromise' in t; assert 'fullAnalysisReady = true;' in t"
          python -c "from pathlib import Path; t=Path('sethistock.html').read_text(); s=t.index('<script>\n        const API_URL')+len('<script>'); e=t.index('</script>',s); Path('/tmp/sethistock-main.js').write_text(t[s:e])"
          node --check /tmp/sethistock-main.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethistock.html
          git commit -m "Keep progressive quote hydration nonblocking"
          git push
