name: Phase 2 Analytics Refactor

on:
  push:
    branches: [phase2-analytics-refactor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-analytics-refactor

      - name: Apply Analytics refactor patch
        run: python .github/scripts/phase2_analytics_refactor_patch.py

      - name: Validate SethiPortfolio JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script)
                  temp = f.name
              subprocess.run(['node', '--check', temp], check=True)
          PY
          grep -q 'Return Efficiency' sethiportfolio.html
          grep -q 'analytics-sortino' sethiportfolio.html
          grep -q 'analytics-downside' sethiportfolio.html
          grep -q 'analytics-gain-loss' sethiportfolio.html
          grep -q 'analytics-tail' sethiportfolio.html
          grep -q 'renderAnalytics();' sethiportfolio.html

      - name: Commit Analytics refactor
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git commit -m "Refactor SethiPortfolio Analytics into return efficiency"
          git push origin HEAD:phase2-analytics-refactor
