name: Phase 2.1 Attribution UI

on:
  push:
    branches: [phase2-attribution-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-attribution-ui

      - name: Apply attribution UI patch
        run: python .github/scripts/phase2_attribution_ui_patch.py

      - name: Validate SethiPortfolio JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script)
                  temp = f.name
              subprocess.run(['node', '--check', temp], check=True)
          PY
          grep -q 'Performance Attribution' sethiportfolio.html
          grep -q '/attribution' sethiportfolio.html
          grep -q 'renderAttribution' sethiportfolio.html

      - name: Commit attribution UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git commit -m "Add performance attribution to SethiPortfolio"
          git push origin phase2-attribution-ui
