name: Phase 2.3 Drawdown and Rolling Performance

on:
  push:
    branches: [phase2-drawdown-rolling]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-drawdown-rolling

      - name: Apply Phase 2.3 patch
        run: python .github/scripts/phase2_drawdown_rolling_patch.py

      - name: Validate SethiPortfolio JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script)
                  temp = f.name
              subprocess.run(['node', '--check', temp], check=True)
          PY
          grep -q 'Drawdown &amp;' sethiportfolio.html
          grep -q 'drawdownAnalysis' sethiportfolio.html
          grep -q 'rollingMetricSeries' sethiportfolio.html
          grep -q 'Max DD Recovery' sethiportfolio.html
          grep -q 'drawdown-benchmark-select' sethiportfolio.html

      - name: Commit Phase 2.3 UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git commit -m "Add drawdown and rolling performance analytics"
          git push origin HEAD:phase2-drawdown-rolling
