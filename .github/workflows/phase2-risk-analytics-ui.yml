name: Phase 2.4 Portfolio Risk Analytics UI

on:
  push:
    branches: [phase2-risk-analytics-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-risk-analytics-ui

      - name: Apply risk analytics UI patch
        run: python .github/scripts/phase2_risk_analytics_ui_patch.py

      - name: Validate SethiPortfolio JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script)
                  temp = f.name
              subprocess.run(['node', '--check', temp], check=True)
          PY
          grep -q 'Portfolio Risk' sethiportfolio.html
          grep -q 'risk-contribution-chart' sethiportfolio.html
          grep -q 'risk-correlation-chart' sethiportfolio.html
          grep -q 'loadRiskAnalytics' sethiportfolio.html
          grep -q 'effective_holdings' .github/scripts/phase2_risk_analytics_ui_patch.py

      - name: Commit risk analytics UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patch already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html
          git commit -m "Add portfolio risk analytics to SethiPortfolio"
          git push origin HEAD:phase2-risk-analytics-ui
