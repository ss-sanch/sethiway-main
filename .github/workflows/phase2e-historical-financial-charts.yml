name: Phase 2E Historical Financial Charts

on:
  push:
    branches: [phase2e-historical-financial-charts]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2e-historical-financial-charts

      - name: Apply Phase 2E HTML patch
        run: python .phase2e_patch.py

      - name: Validate JavaScript syntax
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path('sethistock.html').read_text(encoding='utf-8')
          blocks = re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>', text, flags=re.S | re.I)
          Path('/tmp/sethistock-inline.js').write_text('\n'.join(blocks), encoding='utf-8')
          print(f'INLINE_BLOCKS={len(blocks)}')
          PY
          node --check /tmp/sethistock-inline.js

      - name: Validate Phase 2E wiring
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('sethistock.html').read_text(encoding='utf-8')
          js = Path('sethistock-financial-history.js').read_text(encoding='utf-8')
          assert html.count('data-financial-period=') == 3
          assert 'sethistock-financial-history.js' in html
          assert 'financial-history-status' in html
          assert 'financial-history-alert' in html
          assert 'comparison-period-label' in html
          assert '.financial-period-btn.active' in html
          assert '/api/sec/${encodeURIComponent(ticker)}/fundamentals/series?' in js
          assert "'annual', quarterly: 'Quarterly', ttm: 'TTM'" not in js  # guard accidental malformed map
          assert 'period_engine_version' in js
          assert 'Plotly.react' in js
          assert 'fetchJsonWithRetry' in js
          assert 'Legacy annual data' in js
          assert 'basis_mismatch' not in js or 'qualityWarnings' in js
          print('PHASE2E_STATIC_OK')
          PY

      - name: Smoke module boot with DOM stubs
        run: |
          node - <<'NODE'
          global.window = global;
          global.state = { ticker: '', financialPeriod: 'annual' };
          global.API_URL = 'https://example.invalid';
          global.fetchJsonWithRetry = async () => { throw new Error('not called in boot smoke'); };
          global.Plotly = { react() {} };
          global.document = {
            querySelectorAll() { return []; },
            getElementById() { return null; }
          };
          require('./sethistock-financial-history.js');
          if (typeof global.injectFinancialHTML !== 'function') throw new Error('injectFinancialHTML override missing');
          if (typeof global.drawFinancials !== 'function') throw new Error('drawFinancials override missing');
          if (!global.SethiStockFinancialHistory || typeof global.SethiStockFinancialHistory.load !== 'function') throw new Error('debug surface missing');
          console.log('PHASE2E_MODULE_BOOT_OK');
          NODE

      - name: Commit HTML wiring
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sethistock.html
          git commit -m "Wire Phase 2E historical financial charts" || true
          git pull --rebase origin phase2e-historical-financial-charts
          git push
