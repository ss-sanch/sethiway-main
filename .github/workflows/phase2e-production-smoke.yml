name: Phase 2E Production Smoke

on:
  push:
    branches: [phase2e-production-smoke]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed SethiStock Phase 2E assets
        run: |
          python - <<'PY'
          import time
          import urllib.request

          urls = {
              'html': 'https://sethiway.com/sethistock.html',
              'js': 'https://sethiway.com/sethistock-financial-history.js',
          }
          deadline = time.time() + 180
          last = None
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(urls['html'], timeout=30) as response:
                      html = response.read().decode('utf-8')
                  with urllib.request.urlopen(urls['js'], timeout=30) as response:
                      js = response.read().decode('utf-8')
                  checks = [
                      'sethistock-financial-history.js' in html,
                      html.count('data-financial-period=') == 3,
                      'financial-history-status' in html,
                      'comparison-period-label' in html,
                      '/api/sec/${encodeURIComponent(ticker)}/fundamentals/series?' in js,
                      "container.dataset?.phase2eReady !== '1'" in js,
                      "? 'Point-in-time'" in js,
                      'Plotly.react' in js,
                  ]
                  if all(checks):
                      print('PHASE2E_PUBLIC_HTML_BYTES=', len(html))
                      print('PHASE2E_PUBLIC_JS_BYTES=', len(js))
                      print('PHASE2E_PUBLIC_PRODUCTION_OK')
                      break
                  last = ('content_not_updated', checks)
              except Exception as exc:
                  last = repr(exc)
              time.sleep(5)
          else:
              raise AssertionError(f'Public Phase 2E assets did not become ready: {last}')
          PY
