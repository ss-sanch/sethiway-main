name: Phase 3.2 FX Analytics UI

on:
  push:
    branches: [phase3-fx-analytics-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-fx-analytics-ui
      - name: Apply FX analytics UI patch
        run: python .github/scripts/phase3_fx_ui_patch.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
          for script in scripts:
              if not script.strip():
                  continue
              with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                  f.write(script)
                  temp = f.name
              subprocess.run(['node','--check',temp], check=True)
          PY
          grep -q 'FX Analytics' sethiportfolio.html
          grep -q 'loadFxAnalytics' sethiportfolio.html
          grep -q 'fx-decomposition-chart' sethiportfolio.html
          grep -q 'Sterling Shock Sensitivity' sethiportfolio.html
      - name: Commit FX analytics UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.html
          git commit -m 'Add portfolio FX analytics section'
          git push origin HEAD:phase3-fx-analytics-ui
