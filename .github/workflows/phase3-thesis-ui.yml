name: Phase 3.1 Thesis Tracking UI

on:
  push:
    branches: [phase3-thesis-ui]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-thesis-ui
      - name: Apply public thesis monitor patch
        run: python .github/scripts/phase3_thesis_public_patch.py
      - name: Apply thesis admin patch
        run: python .github/scripts/phase3_thesis_admin_patch.py
      - name: Validate inline JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          for name in ['sethiportfolio.html','sethiportfolio-admin.html']:
              text = Path(name).read_text()
              scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, re.S | re.I)
              for script in scripts:
                  if not script.strip():
                      continue
                  with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
                      f.write(script)
                      temp = f.name
                  subprocess.run(['node','--check',temp], check=True)
          PY
          grep -q 'Thesis Monitor' sethiportfolio.html
          grep -q 'loadTheses' sethiportfolio.html
          grep -q 'Thesis Tracking' sethiportfolio-admin.html
          grep -q 'thesis-review-form' sethiportfolio-admin.html
      - name: Commit thesis UI
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Patches already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiportfolio.html sethiportfolio-admin.html
          git commit -m "Add Phase 3 thesis tracking interfaces"
          git push origin HEAD:phase3-thesis-ui
