name: Phase 3E Company Drivers validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'sethistock-company-drivers.js'
      - 'sethiway-history.js'
      - '.github/workflows/phase3e-company-drivers-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - name: Validate JavaScript syntax and wiring
        run: |
          node --check sethistock-company-drivers.js
          node --check sethiway-history.js
          python - <<'PY'
          from pathlib import Path
          driver = Path('sethistock-company-drivers.js').read_text()
          loader = Path('sethiway-history.js').read_text()
          required = [
              '/api/drivers/',
              'company-drivers',
              'driver-period-btn',
              'cache_persistent',
              'source_url',
              'accession',
              'connectgaps: false',
              'MAX_PARALLEL = 3',
          ]
          missing = [item for item in required if item not in driver]
          assert not missing, f'Missing Phase 3E contracts: {missing}'
          assert 'sethistock-company-drivers.js?v=3e1' in loader
          assert "'company-drivers': 'Company Drivers'" in loader
          print('PHASE3E_STATIC_OK')
          PY

      - name: Verify live persisted driver contracts
        env:
          API: https://sethistock-api.onrender.com
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$API/api/drivers/AAPL/coverage" -o /tmp/aapl-coverage.json
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$API/api/drivers/AAPL/history/services_revenue?filings=16&period=quarterly&limit=40" -o /tmp/aapl.json
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$API/api/drivers/V/history/processed_transactions?filings=16&period=quarterly&limit=40" -o /tmp/v.json
          curl --retry 3 --retry-all-errors --connect-timeout 20 --max-time 120 -fsS "$API/api/drivers/NVDA/history/gross_margin?filings=16&period=quarterly&limit=40" -o /tmp/nvda.json
          python - <<'PY'
          import json
          from pathlib import Path

          coverage = json.loads(Path('/tmp/aapl-coverage.json').read_text())
          assert coverage['ticker'] == 'AAPL'
          assert coverage['verified_count'] >= 3

          cases = [
              ('AAPL', 'services_revenue', '/tmp/aapl.json'),
              ('V', 'processed_transactions', '/tmp/v.json'),
              ('NVDA', 'gross_margin', '/tmp/nvda.json'),
          ]
          for ticker, metric, path in cases:
              payload = json.loads(Path(path).read_text())
              assert payload['ticker'] == ticker, payload
              assert payload['metric'] == metric, payload
              assert payload['verified'] is True, payload
              assert payload.get('cache_persistent') is True, payload
              observations = payload.get('observations') or []
              assert observations, payload
              latest = observations[-1]
              for key in ('value', 'filing_date', 'accession', 'source_url', 'extraction_method'):
                  assert latest.get(key) is not None, (ticker, metric, key, latest)
              print(ticker, metric, len(observations), payload.get('source_mode'), payload.get('cache_fresh'))
          print('PHASE3E_LIVE_API_OK')
          PY
