name: Portfolio Lab Polish

on:
  push:
    branches: [phase3-portfolio-lab-refactor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-portfolio-lab-refactor
      - name: Apply polish patch
        run: python .github/scripts/portfolio_lab_polish_patch.py
      - name: Validate HTML scripts and requested changes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/sethiportfolio-inline.js').write_text('\n'.join(scripts))
          assert 'hidden xl:flex absolute left-1/2 -translate-x-1/2' in text
          assert 'items-stretch' in text
          assert 'id="weights-chart" class="flex-1 min-h-[390px]"' in text
          assert '.portfolio-lab-panel .section-intro { display: none; }' in text
          assert 'What if I change my positions' in text
          assert 'What drove my return' in text
          print('Portfolio Lab polish anchors validated')
          PY
          node --check /tmp/sethiportfolio-inline.js
      - name: Commit polish
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.html
          git commit -m 'Polish Portfolio Lab navigation and layout'
          git push origin HEAD:phase3-portfolio-lab-refactor
