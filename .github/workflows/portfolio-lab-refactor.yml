name: Portfolio Lab Refactor

on:
  push:
    branches: [phase3-portfolio-lab-refactor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-portfolio-lab-refactor
      - name: Apply information architecture refactor
        run: python .github/scripts/portfolio_lab_refactor_patch.py
      - name: Validate HTML scripts and architecture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/sethiportfolio-inline.js').write_text('\n'.join(scripts))
          assert text.count('id="portfolio-lab"') == 1
          assert text.count('data-lab-tab=') == 4
          assert text.count('data-lab-panel=') == 4
          assert 'Performance Diagnostics' in text
          assert 'Risk &amp; Exposure' in text
          assert 'Portfolio Admin' in text and 'Back to Hub' in text
          assert 'initialisePortfolioLab();' in text
          assert 'phase3-rebalance' not in text
          print('Portfolio Lab architecture anchors validated')
          PY
          node --check /tmp/sethiportfolio-inline.js
      - name: Commit refactor
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.html
          git commit -m 'Refactor SethiPortfolio into primary view and Portfolio Lab'
          git push origin HEAD:phase3-portfolio-lab-refactor
