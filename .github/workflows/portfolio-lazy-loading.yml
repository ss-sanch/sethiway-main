name: Portfolio Progressive Loading

on:
  push:
    branches: [phase3-portfolio-lab-refactor]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase3-portfolio-lab-refactor
      - name: Apply progressive loading patch
        run: python .github/scripts/portfolio_lazy_loading_patch.py
      - name: Validate JavaScript and lazy-loading structure
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('sethiportfolio.html').read_text()
          scripts = re.findall(r'<script>(.*?)</script>', text, flags=re.S)
          Path('/tmp/sethiportfolio-inline.js').write_text('\n'.join(scripts))
          assert 'let currentPortfolioLabTab = null;' in text
          assert 'Select a workspace below. Advanced analytics are loaded only when you open them' in text
          assert 'setupDeferredDecisionLoading();' in text
          assert 'loadExposureMap();\n    loadFxAnalytics();\n    loadRiskAnalytics();' not in text
          assert "fetch(`${API_BASE}/${PORTFOLIO_SLUG}/attribution`)" in text
          assert "fetch(`${API_BASE}/${PORTFOLIO_SLUG}/journal?limit=100`)" in text
          assert "domain:{x:[0.03,0.88]" in text
          assert 'portfolio-lab-panel hidden' in text
          assert text.count('data-lab-panel=') == 4
          print('Progressive loading anchors validated')
          PY
          node --check /tmp/sethiportfolio-inline.js
      - name: Commit progressive loading changes
        run: |
          if git diff --quiet; then
            echo 'Patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethiportfolio.html
          git commit -m 'Lazy load Portfolio Lab and Investment Decisions'
          git push origin HEAD:phase3-portfolio-lab-refactor
