name: Release SethiPortfolio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Release SethiPortfolio
        run: python .github/scripts/release_sethiportfolio.py
      - name: Validate release link
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text()
          assert 'href="sethiportfolio.html"' in text
          assert 'Unlock Vault' in text
          assert 'Locked - In Development' not in text
          print('SethiPortfolio public link validated')
          PY
      - name: Commit release
        run: |
          if git diff --quiet; then
            echo 'Release patch already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Release SethiPortfolio from SethiWay hub'
          git push origin HEAD:main
