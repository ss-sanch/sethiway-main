name: Align MRL card bottoms
on:
  push:
    branches:
      - feature/sethiquant-mrl-layout-v1
    paths:
      - scripts/align_mrl_bottoms.py
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiquant-mrl-layout-v1
      - run: python scripts/align_mrl_bottoms.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Align Market Risk Lab card bottoms [skip ci]"
          git push origin HEAD:feature/sethiquant-mrl-layout-v1
