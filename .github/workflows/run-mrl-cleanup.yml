name: Run MRL PR cleanup
on:
  push:
    branches:
      - feature/sethiquant-mrl-layout-v1
    paths:
      - .github/workflows/run-mrl-cleanup.yml
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sethiquant-mrl-layout-v1
      - run: python scripts/revert_non_mrl_change.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git commit -m "Keep Phase 1 scoped to Market Risk Lab [skip ci]"
          git push origin HEAD:feature/sethiquant-mrl-layout-v1
