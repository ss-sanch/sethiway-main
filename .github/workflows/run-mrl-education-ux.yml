name: Run MRL education UX migration
on:
  push:
    branches:
      - feature/mrl-stress-testing
    paths:
      - scripts/apply_mrl_education_ux.py
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mrl-stress-testing
      - run: python scripts/apply_mrl_education_ux.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Improve Market Risk Lab educational UX [skip ci]"
          git push origin HEAD:feature/mrl-stress-testing
