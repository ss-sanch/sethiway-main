name: Run MRL option cancel fix
on:
  push:
    branches:
      - feature/mrl-derivatives-risk
    paths:
      - scripts/fix_mrl_option_cancel.py
      - .github/workflows/run-mrl-option-cancel-fix.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mrl-derivatives-risk
      - run: python scripts/fix_mrl_option_cancel.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix options overlay cancel state [skip ci]"
          git push origin HEAD:feature/mrl-derivatives-risk
# trigger
