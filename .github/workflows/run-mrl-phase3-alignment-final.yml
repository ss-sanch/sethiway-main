name: Run final MRL Phase 3 alignment
on:
  push:
    branches:
      - feature/mrl-stress-testing
    paths:
      - scripts/align_mrl_phase3_cards_final.py
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mrl-stress-testing
      - run: python scripts/align_mrl_phase3_cards_final.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Finish Phase 3 MRL card alignment [skip ci]"
          git push origin HEAD:feature/mrl-stress-testing
