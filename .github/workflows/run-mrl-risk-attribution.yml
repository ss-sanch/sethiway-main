name: Run MRL Risk Attribution Migration
on:
  push:
    branches:
      - feature/mrl-risk-attribution
    paths:
      - scripts/apply_mrl_risk_attribution.py
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mrl-risk-attribution
      - run: python scripts/apply_mrl_risk_attribution.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Market Risk Lab risk attribution [skip ci]"
          git push origin HEAD:feature/mrl-risk-attribution
