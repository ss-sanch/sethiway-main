name: Run Options Valuation 2.0 migration
on:
  push:
    branches:
      - feature/options-valuation-v2
permissions:
  contents: write
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/options-valuation-v2
      - run: python scripts/apply_options_v2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethiquant.html
          git diff --cached --quiet && exit 0
          git commit -m "Add Options Valuation 2.0 insights [skip ci]"
          git push origin HEAD:feature/options-valuation-v2
