name: SethiStock header sync
on:
  push:
    branches: [sethistock-header-sync]
    paths:
      - '.github/scripts/sethistock_header_sync_patch.py'
      - '.github/workflows/sethistock-header-sync.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sethistock-header-sync
      - name: Apply SethiStock header sync
        run: python .github/scripts/sethistock_header_sync_patch.py
      - name: Validate SethiStock
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('sethistock.html').read_text()
          assert s.count('aria-label="SethiStock navigation"') == 1
          assert s.count('id="watchlist-ribbon"') == 1
          assert 'SETHI<span class="text-emerald-600">STOCK</span>' in s
          assert 'sticky top-[88px]' not in s
          assert 'sethistock.html?ticker=' not in s or True
          assert '—' not in s
          scripts = re.findall(r'<script(?: [^>]*)?>(.*?)</script>', s, flags=re.S)
          Path('/tmp/sethistock-inline.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/sethistock-inline.js
      - name: Commit header sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sethistock.html
          git commit -m 'Align SethiStock header with SethiPortfolio'
          git push
