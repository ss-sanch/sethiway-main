name: Temporary SethiStock Research Labs frontend check

on:
  push:
    branches:
      - feature/sethistock-research-labs
    paths:
      - .github/workflows/temp-sethistock-research-check.yml

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sethistock-research-labs
          fetch-depth: 0

      - name: Check JavaScript syntax
        run: node --check sethistock-research.js

      - name: Verify single integration tag
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('sethistock.html').read_text(encoding='utf-8')
          js = Path('sethistock-research.js').read_text(encoding='utf-8')
          assert html.count('sethistock-research.js?v=20260831') == 1
          assert 'section.id = "research-labs"' in js
          assert '/api/research/' in js
          PY

      - name: Remove temporary check workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-sethistock-research-check.yml
          git commit -m "Remove temporary SethiStock research check [skip ci]"
          git push origin feature/sethistock-research-labs
