name: Temporary SethiStock research integration

on:
  push:
    branches:
      - feature/sethistock-research-labs
    paths:
      - .github/workflows/temp-sethistock-research-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/sethistock-research-labs
          fetch-depth: 0

      - name: Patch SethiStock HTML
        run: python scripts/patch_sethistock_research.py

      - name: Commit integrated page and remove temporary patch files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethistock.html
          git rm scripts/patch_sethistock_research.py .github/workflows/temp-sethistock-research-patch.yml
          git commit -m "Integrate SethiStock Research Labs [skip ci]"
          git push origin feature/sethistock-research-labs
