name: Temporary GOOG Driver canonicalisation patch

on:
  push:
    branches: [canonicalise-goog-inside-driver-module]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonicalise-goog-inside-driver-module
      - name: Canonicalise GOOG inside Company Drivers module
        run: |
          python - <<'PY'
          from pathlib import Path

          drivers = Path('sethistock-company-drivers.js')
          text = drivers.read_text()
          old = """        const symbol = String(ticker || '').trim().toUpperCase();\n        if (!symbol) return;\n        activeTicker = symbol;\n"""
          new = """        const requestedSymbol = String(ticker || '').trim().toUpperCase();\n        if (!requestedSymbol) return;\n        const symbol = requestedSymbol === 'GOOG' ? 'GOOGL' : requestedSymbol;\n        activeTicker = symbol;\n"""
          assert old in text, 'loadCompanyDrivers ticker target not found'
          drivers.write_text(text.replace(old, new, 1))

          history = Path('sethiway-history.js')
          text = history.read_text()
          assert "sethistock-company-drivers.js?v=3e4" in text
          history.write_text(text.replace("sethistock-company-drivers.js?v=3e4", "sethistock-company-drivers.js?v=3e5", 1))
          PY

          node --check sethistock-company-drivers.js
          node --check sethiway-history.js
          grep -q "requestedSymbol === 'GOOG' ? 'GOOGL'" sethistock-company-drivers.js
          grep -q "sethistock-company-drivers.js?v=3e5" sethiway-history.js

      - name: Commit patch and remove runner
        run: |
          rm .github/workflows/tmp-canonical-goog-driver-module.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock-company-drivers.js sethiway-history.js .github/workflows/tmp-canonical-goog-driver-module.yml
          git commit -m "Canonicalise GOOG inside Company Drivers module"
          git push origin HEAD:canonicalise-goog-inside-driver-module