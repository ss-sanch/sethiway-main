name: Temporary Driver lifecycle hardening

on:
  push:
    branches: [fix-driver-lifecycle-remove-reported]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-driver-lifecycle-remove-reported
          fetch-depth: 0
      - name: Harden resolved ticker autoload and default period
        run: |
          python - <<'PY'
          from pathlib import Path

          path=Path('sethistock-company-drivers.js')
          text=path.read_text()
          old="""            window.addEventListener('sethistock:analysis-start', event => {\n                const sequence = Number(event?.detail?.sequence || 0);\n                if (sequence) lifecycleSequence = Math.max(lifecycleSequence, sequence);\n            });\n"""
          new="""            window.addEventListener('sethistock:analysis-start', event => {\n                const sequence = Number(event?.detail?.sequence || 0);\n                if (sequence) lifecycleSequence = Math.max(lifecycleSequence, sequence);\n                // Every new company starts from the fastest, pre-warmed investor view.\n                activePeriod = 'quarterly';\n                syncPeriodButtons();\n            });\n"""
          assert text.count(old)==1, text.count(old)
          text=text.replace(old,new)
          path.write_text(text)

          path=Path('sethiway-history.js')
          text=path.read_text()
          anchor="""        const searchForm = document.querySelector('#search-form');\n        const tickerInput = document.querySelector('#ticker-input');\n"""
          insert="""        // A smart-search/company-name query may only resolve to a supported ticker\n        // after the main analysis. Ensure the Driver module is present for that\n        // resolved ticker even if the raw input was not itself a ticker symbol.\n        window.addEventListener('sethistock:analysis-ready', event => {\n            const resolvedTicker = normaliseDriverTicker(event?.detail?.ticker);\n            if (SUPPORTED_DRIVER_TICKERS.has(resolvedTicker)) {\n                loadCompanyDriversModule(false).catch(() => null);\n            }\n        });\n\n        const searchForm = document.querySelector('#search-form');\n        const tickerInput = document.querySelector('#ticker-input');\n"""
          assert text.count(anchor)==1, text.count(anchor)
          text=text.replace(anchor,insert)
          path.write_text(text)

          path=Path('sethistock.html')
          text=path.read_text()
          assert text.count('<script src="sethiway-history.js"></script>')==1
          text=text.replace('<script src="sethiway-history.js"></script>','<script src="sethiway-history.js?v=stock3e7"></script>')
          path.write_text(text)
          PY
          node --check sethistock-company-drivers.js
          node --check sethiway-history.js
          python - <<'PY'
          from pathlib import Path
          assert "activePeriod = 'quarterly'" in Path('sethistock-company-drivers.js').read_text()
          assert "sethistock:analysis-ready" in Path('sethiway-history.js').read_text()
          assert 'sethiway-history.js?v=stock3e7' in Path('sethistock.html').read_text()
          print('DRIVER_LIFECYCLE_HARDENING_OK')
          PY
      - name: Commit hardening and remove runner
        run: |
          git config user.name 'ss-sanch'
          git config user.email 'mlgsanch@gmail.com'
          git rm .github/workflows/tmp-driver-lifecycle-hardening.yml
          git add sethistock.html sethistock-company-drivers.js sethiway-history.js
          git commit -m 'Harden Company Driver lifecycle autoload'
          git push origin HEAD:fix-driver-lifecycle-remove-reported
