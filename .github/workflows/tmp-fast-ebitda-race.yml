name: Temporary EBITDA fallback race patch

on:
  push:
    branches:
      - phase4a-financial-fast-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-fast-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/tmp_fix_fast_ebitda_race.py
      - name: Validate
        run: |
          node --check sethistock-financial-history.js
          grep -c "applyFastEbitdaFallback(ticker, fallbackView);" sethistock-financial-history.js | grep -Eq '^[3-9][0-9]*$'
      - name: Commit and clean tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp_fix_fast_ebitda_race.py .github/workflows/tmp-fast-ebitda-race.yml
          git add sethistock-financial-history.js
          git commit -m "Phase 4A: preserve fast EBITDA fallback through first render"
          git push origin HEAD:phase4a-financial-fast-fallback
