name: Temporary fast fallback v2 patch

on:
  push:
    branches:
      - phase4a-financial-fast-fallback

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-fast-fallback
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/tmp_fix_fast_fallback_v2.py
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          node --check sethistock-ui-stability.js
          grep -q "is_null_shield: true" sethistock.html
          grep -q "cleanFin.ebitda.push" sethistock.html
          grep -q "fastResearchCache" sethistock-financial-history.js
          grep -q "section.is_null_shield" sethistock-ui-stability.js
      - name: Commit application changes and remove temporary tooling
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/tmp_fix_fast_fallback_v2.py .github/workflows/tmp-fast-fallback-v2.yml
          git add sethistock-financial-history.js sethistock-ui-stability.js sethistock.html
          git commit -m "Phase 4A: fix fast financial fallbacks and ticker stability"
          git push origin HEAD:phase4a-financial-fast-fallback
