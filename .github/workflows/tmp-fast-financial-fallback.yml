name: Temporary fast financial fallback patch
on:
  push:
    branches:
      - phase4a-financial-fast-fallback
    paths:
      - .github/patch_fast_financial_fallback.py
      - .github/workflows/tmp-fast-financial-fallback.yml
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-fast-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python .github/patch_fast_financial_fallback.py
      - name: Validate JavaScript
        run: node --check sethistock-financial-history.js
      - name: Commit application change and remove temporary tooling
        run: |
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          rm -f .github/patch_fast_financial_fallback.py .github/workflows/tmp-fast-financial-fallback.yml
          git add -A
          git commit -m "Phase 4A: add fast supplementary financial fallbacks"
          git push origin HEAD:phase4a-financial-fast-fallback
