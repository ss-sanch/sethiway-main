name: Temporary expanded chart fix

on:
  push:
    branches: [phase4a-financial-dashboard-12charts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-dashboard-12charts
          fetch-depth: 0
      - name: Apply expanded chart patch
        run: python .github/fix_expanded_charts.py
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          js = Path('sethistock-financial-history.js').read_text()
          for token in ["hoverlabel", "card.style.transform = 'none'", "card.style.right = '0'", "Plotly.Plots.resize(expandedPlot)"]:
              assert token in js, token
          assert "backdrop-blur-sm" not in js
          print('EXPANDED_CHART_FIX_STATIC_OK')
          PY
      - name: Commit frontend fix
        run: |
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git rm .github/workflows/tmp-fix-expanded-charts.yml .github/fix_expanded_charts.py
          git add sethistock-financial-history.js
          git commit -m "Fix expanded chart clarity and hover labels"
          git push origin phase4a-financial-dashboard-12charts
