name: Temporary expanded chart fix

on:
  push:
    branches: [phase4a-financial-dashboard-12charts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-dashboard-12charts
          fetch-depth: 0
      - name: Patch expanded chart rendering and tooltips
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('sethistock-financial-history.js')
          text = path.read_text()

          replacements = [
              ("""        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.maxWidth = '';
        card.style.height = '';
        card.style.transform = '';
        card.style.zIndex = '';
        card.style.boxShadow = '';
        card.style.overflow = '';""",
               """        card.style.position = '';
        card.style.left = '';
        card.style.right = '';
        card.style.top = '';
        card.style.bottom = '';
        card.style.width = '';
        card.style.maxWidth = '';
        card.style.height = '';
        card.style.margin = '';
        card.style.transform = '';
        card.style.zIndex = '';
        card.style.boxShadow = '';
        card.style.overflow = '';"""),
              ("backdrop.className = 'fixed inset-0 z-[150] bg-gray-900/55 backdrop-blur-sm';",
               "backdrop.className = 'fixed inset-0 z-[150] bg-gray-900/55';"),
              ("""        card.style.position = 'fixed';
        card.style.left = '50%';
        card.style.top = '7vh';
        card.style.width = '92vw';
        card.style.maxWidth = '1280px';
        card.style.height = '86vh';
        card.style.transform = 'translateX(-50%)';
        card.style.zIndex = '160';
        card.style.boxShadow = '0 30px 70px rgba(15, 23, 42, 0.28)';
        card.style.overflow = chartId === 'ind-earnings' ? 'auto' : 'hidden';""",
               """        // Avoid transforms on the expanded Plotly container: transformed SVGs can
        // land on fractional pixels and render soft. Left/right + auto margins centres crisply.
        card.style.position = 'fixed';
        card.style.left = '0';
        card.style.right = '0';
        card.style.top = '6vh';
        card.style.bottom = '6vh';
        card.style.width = 'calc(100vw - 48px)';
        card.style.maxWidth = '1280px';
        card.style.height = '88vh';
        card.style.margin = '0 auto';
        card.style.transform = 'none';
        card.style.zIndex = '160';
        card.style.boxShadow = '0 30px 70px rgba(15, 23, 42, 0.28)';
        card.style.overflow = chartId === 'ind-earnings' ? 'auto' : 'hidden';"""),
              ("chart.style.height = 'calc(86vh - 118px)';", "chart.style.height = 'calc(88vh - 118px)';"),
              ("""        requestAnimationFrame(() => {
            renderFinancialCharts(displayedView);
            Plotly.Plots.resize(chartId);
        });""",
               """        // Let fixed positioning settle before Plotly measures the enlarged card.
        requestAnimationFrame(() => {
            requestAnimationFrame(() => {
                renderFinancialCharts(displayedView);
                const expandedPlot = document.getElementById(chartId);
                if (expandedPlot) Plotly.Plots.resize(expandedPlot);
                setTimeout(() => {
                    if (expandedPlot?.isConnected) Plotly.Plots.resize(expandedPlot);
                }, 80);
            });
        });"""),
              ("""            autosize: true,
            hovermode: 'x unified',
            xaxis: {""",
               """            autosize: true,
            hovermode: 'x unified',
            hoverlabel: {
                bgcolor: '#ffffff',
                bordercolor: '#cbd5e1',
                font: { color: '#0f172a', size: 12 },
                align: 'left',
                namelength: -1
            },
            xaxis: {""")
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Patch target not found: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          grep -q "hoverlabel" sethistock-financial-history.js
          grep -q "card.style.transform = 'none'" sethistock-financial-history.js
          grep -q "card.style.right = '0'" sethistock-financial-history.js
      - name: Commit fixes
        run: |
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git rm .github/workflows/tmp-fix-expanded-charts.yml
          git add sethistock-financial-history.js
          git commit -m "Fix expanded chart clarity and hover labels"
          git push origin phase4a-financial-dashboard-12charts
