name: Temporary GOOG Driver and annual preload patch

on:
  push:
    branches: [fix-goog-driver-race-annual-preload]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-goog-driver-race-annual-preload
      - name: Patch Driver synchronisation and background prefetch
        run: |
          python - <<'PY'
          from pathlib import Path

          stability = Path('sethistock-ui-stability.js')
          text = stability.read_text()
          old = """        const apply = drivers => {\n            if (!drivers || token !== analysisWaitToken || !analysisReady() || currentStateTicker() !== rawTicker) return;\n            const statusText = document.getElementById('driver-status')?.textContent || '';\n"""
          new = """        const apply = drivers => {\n            // GOOG and GOOGL are one Company Driver identity. The core stock analysis\n            // may resolve from GOOG to GOOGL while this async module is loading, so\n            // compare canonical Driver tickers rather than the raw symbols.\n            if (!drivers || token !== analysisWaitToken || !analysisReady() || canonicalDriverTicker(currentStateTicker()) !== driverTicker) return;\n            const statusText = document.getElementById('driver-status')?.textContent || '';\n"""
          assert old in text, 'stability apply target not found'
          stability.write_text(text.replace(old, new, 1))

          drivers = Path('sethistock-company-drivers.js')
          text = drivers.read_text()
          old_constants = """    const MEMORY_MAX = 120;\n    const MAX_PARALLEL = 3;\n\n    let activeTicker = '';\n"""
          new_constants = """    const MEMORY_MAX = 120;\n    const MAX_PARALLEL = 3;\n    const PREFETCH_PARALLEL = 2;\n\n    let activeTicker = '';\n"""
          assert old_constants in text, 'driver constants target not found'
          text = text.replace(old_constants, new_constants, 1)

          old_state = """    let latestRegistry = null;\n    let latestCoverage = null;\n    const historyCache = new Map();\n"""
          new_state = """    let latestRegistry = null;\n    let latestCoverage = null;\n    let prefetchGeneration = 0;\n    const historyCache = new Map();\n"""
          assert old_state in text, 'driver state target not found'
          text = text.replace(old_state, new_state, 1)

          marker = "    async function renderDrivers(ticker, registry, coverage, period = activePeriod) {\n"
          assert marker in text, 'renderDrivers marker not found'
          helper = """    async function prefetchPeriod(ticker, registry, coverage, period, generation) {\n        const coverageMap = new Map((coverage?.metrics || []).map(row => [row.key, row]));\n        const verifiedMetrics = (registry?.metrics || []).filter(metric => coverageMap.get(metric.key)?.verified === true);\n        if (!verifiedMetrics.length) return;\n\n        await mapConcurrent(verifiedMetrics, PREFETCH_PARALLEL, async metric => {\n            if (generation !== prefetchGeneration || activeTicker !== ticker) return null;\n            try {\n                return await getHistory(ticker, metric.key, period);\n            } catch (_) {\n                // Background hydration must never interrupt the visible Quarterly UI.\n                return null;\n            }\n        });\n    }\n\n    function scheduleAdjacentPeriodPrefetch(ticker, registry, coverage, generation) {\n        const run = async () => {\n            if (generation !== prefetchGeneration || activeTicker !== ticker) return;\n            await prefetchPeriod(ticker, registry, coverage, 'annual', generation);\n            if (generation !== prefetchGeneration || activeTicker !== ticker) return;\n            await prefetchPeriod(ticker, registry, coverage, 'reported', generation);\n        };\n        if (typeof requestIdleCallback === 'function') requestIdleCallback(() => run().catch(() => null), { timeout: 1200 });\n        else setTimeout(() => run().catch(() => null), 300);\n    }\n\n"""
          text = text.replace(marker, helper + marker, 1)

          old_load = """        activeTicker = symbol;\n        latestRegistry = null;\n        latestCoverage = null;\n"""
          new_load = """        activeTicker = symbol;\n        const thisPrefetchGeneration = ++prefetchGeneration;\n        latestRegistry = null;\n        latestCoverage = null;\n"""
          assert old_load in text, 'load generation target not found'
          text = text.replace(old_load, new_load, 1)

          old_render = """            setTheme(registry);\n            await renderDrivers(symbol, registry, coverage, activePeriod);\n"""
          new_render = """            setTheme(registry);\n            await renderDrivers(symbol, registry, coverage, activePeriod);\n            // Quarterly is the visible default. Hydrate Annual (then Reported) quietly\n            // once the first render is complete so tab switches reuse memory/Supabase.\n            if (activePeriod === 'quarterly') {\n                scheduleAdjacentPeriodPrefetch(symbol, registry, coverage, thisPrefetchGeneration);\n            }\n"""
          assert old_render in text, 'load render target not found'
          text = text.replace(old_render, new_render, 1)
          drivers.write_text(text)

          history = Path('sethiway-history.js')
          text = history.read_text()
          assert "sethistock-ui-stability.js?v=2" in text
          assert "sethistock-company-drivers.js?v=3e3" in text
          text = text.replace("sethistock-ui-stability.js?v=2", "sethistock-ui-stability.js?v=3", 1)
          text = text.replace("sethistock-company-drivers.js?v=3e3", "sethistock-company-drivers.js?v=3e4", 1)
          history.write_text(text)
          PY

          node --check sethistock-ui-stability.js
          node --check sethistock-company-drivers.js
          node --check sethiway-history.js
          grep -q "canonicalDriverTicker(currentStateTicker()) !== driverTicker" sethistock-ui-stability.js
          grep -q "scheduleAdjacentPeriodPrefetch" sethistock-company-drivers.js
          grep -q "sethistock-company-drivers.js?v=3e4" sethiway-history.js

      - name: Commit patch and remove runner
        run: |
          rm .github/workflows/tmp-fix-goog-annual.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock-ui-stability.js sethistock-company-drivers.js sethiway-history.js .github/workflows/tmp-fix-goog-annual.yml
          git commit -m "Fix GOOG Driver sync and preload adjacent periods"
          git push origin HEAD:fix-goog-driver-race-annual-preload