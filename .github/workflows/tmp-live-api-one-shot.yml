name: Temporary live API one-shot
on:
  push:
    paths:
      - '.github/workflows/tmp-live-api-one-shot.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe UBER quote with Live Server origin
        shell: bash
        run: |
          set -u
          base='https://sethistock-api.onrender.com'
          code=$(curl -sS -H 'Origin: http://127.0.0.1:5500' -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-time 20 "$base/api/quote/UBER" || true)
          echo "uber=$code"
          cat /tmp/headers || true
          head -c 500 /tmp/body || true
          echo
          test "$code" = "200"
          grep -qi '^access-control-allow-origin: \*' /tmp/headers
