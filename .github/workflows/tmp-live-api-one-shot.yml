name: Temporary live API one-shot
on:
  push:
    paths:
      - '.github/workflows/tmp-live-api-one-shot.yml'
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe root and UBER quote once
        shell: bash
        run: |
          set -u
          base='https://sethistock-api.onrender.com'
          root=$(curl -sS -o /tmp/root -w '%{http_code}' --max-time 12 "$base/" || true)
          uber=$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-time 20 "$base/api/quote/UBER" || true)
          echo "root=$root uber=$uber"
          cat /tmp/headers || true
          head -c 500 /tmp/body || true
          echo
          test "$root" = "200"
          test "$uber" = "200"
          grep -qi '^access-control-allow-origin:' /tmp/headers
