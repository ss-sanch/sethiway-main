name: Temporary live API recovery smoke
on:
  push:
    paths:
      - '.github/workflows/tmp-live-api-recovery-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Render and verify core routes
        shell: bash
        run: |
          set -u
          base='https://sethistock-api.onrender.com'
          ok=0
          for attempt in $(seq 1 24); do
            root=$(curl -sS -o /tmp/root.out -w '%{http_code}' --max-time 25 "$base/" || true)
            uber=$(curl -sS -D /tmp/uber.headers -o /tmp/uber.body -w '%{http_code}' --max-time 40 "$base/api/quote/UBER" || true)
            aapl=$(curl -sS -D /tmp/aapl.headers -o /tmp/aapl.body -w '%{http_code}' --max-time 40 "$base/api/quote/AAPL" || true)
            echo "Attempt $attempt: root=$root uber=$uber aapl=$aapl"
            if [ "$root" = "200" ] && [ "$uber" = "200" ] && [ "$aapl" = "200" ]; then
              if grep -qi '^access-control-allow-origin:' /tmp/uber.headers && grep -qi '^access-control-allow-origin:' /tmp/aapl.headers; then
                ok=1
                break
              fi
            fi
            sleep 15
          done
          echo 'UBER headers:'
          cat /tmp/uber.headers || true
          echo 'UBER body:'
          head -c 500 /tmp/uber.body || true
          echo
          echo 'AAPL headers:'
          cat /tmp/aapl.headers || true
          echo 'AAPL body:'
          head -c 500 /tmp/aapl.body || true
          echo
          test "$ok" = "1"
