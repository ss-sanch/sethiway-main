name: Temporary live GOOG Driver v3e5 proof

on:
  push:
    branches: [proof-goog-driver-live-v3e5]

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Validate final GOOG Driver assets on sethiway.com
        run: |
          set -euo pipefail
          deadline=$((SECONDS+480))
          while (( SECONDS < deadline )); do
            curl -fsSL --max-time 30 'https://sethiway.com/sethiway-history.js' -o /tmp/history.js || true
            curl -fsSL --max-time 30 'https://sethiway.com/sethistock-company-drivers.js?v=3e5' -o /tmp/drivers.js || true
            if grep -q 'sethistock-company-drivers.js?v=3e5' /tmp/history.js 2>/dev/null \
              && grep -q "requestedSymbol === 'GOOG' ? 'GOOGL'" /tmp/drivers.js 2>/dev/null \
              && grep -q 'scheduleAdjacentPeriodPrefetch' /tmp/drivers.js 2>/dev/null; then
              echo 'LIVE_GOOG_V3E5_DEPLOYED'
              exit 0
            fi
            echo 'Waiting for final GitHub Pages deployment...'
            sleep 15
          done
          exit 1
