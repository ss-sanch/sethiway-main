name: Temporary Phase 4A 12-chart dashboard

on:
  push:
    branches: [phase4a-financial-dashboard-12charts]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-dashboard-12charts
          fetch-depth: 0
      - name: Apply 12-chart dashboard patch
        run: python .github/phase4a_12chart_patch.py
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          html = Path('sethistock.html').read_text()
          assert '2xl:grid-cols-4' in html
          assert 'getSethiStockResearch' in html
          js = Path('sethistock-financial-history.js').read_text()
          for token in ['ind-ebitda', 'ind-pe', 'ind-earnings', 'getMarginDeltaStats', 'fetchSecHistoryPayload']:
              assert token in js, token
          print('PHASE4A_12CHART_STATIC_OK')
          PY
      - name: Commit frontend feature
        run: |
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git rm .github/workflows/tmp-phase4a-12chart.yml .github/phase4a_12chart_patch.py
          git add sethistock.html sethistock-financial-history.js
          git commit -m "Build 12-chart financial dashboard"
          git push origin phase4a-financial-dashboard-12charts
