name: Temporary Phase 4A countdown fix v2

on:
  push:
    branches: [phase4a-insights-polish]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-insights-polish
          fetch-depth: 0
      - name: Fix yearless catalyst countdown parsing
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('sethistock.html')
          text = p.read_text()
          pattern = re.compile(r"\s*const setCatalystCountdown = \(id, rawValue\) => \{.*?\n\s*\};\n\s*setCatalystCountdown\('stat-earn-countdown'", re.S)
          replacement = """
          const setCatalystCountdown = (id, rawValue) => {
              const el = document.getElementById(id);
              if (!el) return;
              const textValue = String(rawValue || '').trim();
              const cleanedValue = textValue.replace(/\\b(BMO|AMC)\\b/gi, '').trim();
              if (!cleanedValue) { el.innerText = ''; el.classList.add('hidden'); return; }

              const today = new Date();
              today.setHours(0, 0, 0, 0);
              const hasExplicitYear = /\\b(?:19|20)\\d{2}\\b/.test(cleanedValue);
              const valueForParsing = hasExplicitYear ? cleanedValue : `${cleanedValue}, ${today.getFullYear()}`;
              const parsed = Date.parse(valueForParsing);
              if (!Number.isFinite(parsed)) { el.innerText = ''; el.classList.add('hidden'); return; }

              const target = new Date(parsed);
              target.setHours(0, 0, 0, 0);
              const days = Math.round((target - today) / 86400000);

              if (Math.abs(days) > 400) { el.innerText = ''; el.classList.add('hidden'); return; }
              if (days > 0) el.innerText = `in ${days}d`;
              else if (days === 0) el.innerText = 'today';
              else el.innerText = `${Math.abs(days)}d ago`;
              el.classList.remove('hidden');
          };
          setCatalystCountdown('stat-earn-countdown'"""
          new_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Countdown function replacement count={count}')
          p.write_text(new_text)
          assert 'const hasExplicitYear' in new_text
          assert 'Math.abs(days) > 400' in new_text
          print('PHASE4A_COUNTDOWN_FIX_OK')
          PY
      - name: Validate inline JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethistock.html').read_text()
          scripts = re.findall(r'<script(?:\\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
              f.write(inline)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          print('INLINE_JS_OK')
          PY
      - name: Commit fix and remove temporary workflows
        run: |
          rm -f .github/workflows/tmp-phase4a-countdown-fix.yml .github/workflows/tmp-phase4a-countdown-fix2.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock.html .github/workflows/tmp-phase4a-countdown-fix.yml .github/workflows/tmp-phase4a-countdown-fix2.yml
          git commit -m "Fix catalyst countdown year parsing"
          git push origin phase4a-insights-polish
