name: Temporary Phase 4A edge fix validation
on:
  push:
    branches: [phase4a-runtime-stability]
permissions:
  contents: write
jobs:
  validate:
    if: "contains(github.event.head_commit.message, 'Run final Phase 4A edge validation')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-runtime-stability
      - name: Apply patch
        run: python tmp_phase4a_final_edges_patch.py
      - name: Syntax and contract checks
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          text = Path('sethistock-financial-history.js').read_text()
          assert "study.available !== true" in text
          assert "function collapseAnnualPlotPoints(points)" in text
          assert "annualBars ? points.map(point => point.annualCategory)" in text
          print('PHASE4A_EDGE_CONTRACT_OK')
          PY
      - name: Verify live SPGI research source
        run: |
          python - <<'PY'
          import json, urllib.request
          url='https://sethistock-api.onrender.com/api/research/SPGI'
          with urllib.request.urlopen(url, timeout=35) as response:
              data=json.load(response)
          earnings=data.get('earnings_reaction') or {}
          valuation=data.get('valuation_bands') or {}
          assert earnings.get('available') is True and len(earnings.get('events') or []) > 0, earnings
          assert valuation.get('available') is True and len(valuation.get('observations') or []) > 0, valuation
          print('SPGI_RESEARCH_SOURCE_OK', len(earnings['events']), len(valuation['observations']))
          PY
      - name: Commit application change only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tmp_phase4a_final_edges_patch.py .github/workflows/tmp-phase4a-edge-fix.yml
          git add sethistock-financial-history.js
          git commit -m "Fix SPGI research hydration and annual bar widths"
          git push origin HEAD:phase4a-runtime-stability
