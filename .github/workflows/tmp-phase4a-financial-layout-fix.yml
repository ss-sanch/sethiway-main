name: Temporary Phase 4A financial layout fix

on:
  push:
    branches: [phase4a-financial-metrics]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-metrics
          fetch-depth: 0
      - name: Improve chart space and expanded layout
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('sethistock-financial-history.js')
          text = path.read_text()

          text = text.replace(
              'class="financial-card bg-white px-5 pt-5 pb-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col min-h-[330px] relative"',
              'class="financial-card bg-white px-4 pt-4 pb-3 rounded-2xl shadow-sm border border-gray-200 flex flex-col h-[330px] relative"'
          )
          text = text.replace(
              '<div id="${card.id}" class="h-52 w-full mt-1"></div>',
              '<div id="${card.id}" class="w-full flex-1 min-h-0 mt-0"></div>'
          )
          text = text.replace(
              'class="grid grid-cols-4 gap-2 mt-2 pt-3 border-t border-gray-100"',
              'class="grid grid-cols-4 gap-2 mt-1 pt-2.5 border-t border-gray-100"'
          )
          text = text.replace(
              "margin: { t: 8, b: showLegend ? 42 : 30, l: 54, r: 16 },",
              "margin: { t: 6, b: showLegend ? 40 : 28, l: 44, r: 6 },"
          )

          start = text.index('    function toggleExpandedChart(chartId) {')
          end = text.index('\n    function bindExpandButtons()', start)
          replacement = '''    function clearExpandedCardStyles(card) {
        if (!card) return;
        card.style.position = '';
        card.style.left = '';
        card.style.top = '';
        card.style.width = '';
        card.style.maxWidth = '';
        card.style.height = '';
        card.style.transform = '';
        card.style.zIndex = '';
        card.style.boxShadow = '';
        card.style.overflow = '';
        const chartNode = card.querySelector('[id^="ind-"]');
        if (chartNode) chartNode.style.height = '';
    }

    function toggleExpandedChart(chartId) {
        const card = document.querySelector(`[data-financial-card="${chartId}"]`);
        if (!card) return;
        const currentlyExpanded = expandedChartId === chartId;

        document.querySelectorAll('.financial-card').forEach(clearExpandedCardStyles);
        const existingBackdrop = document.getElementById('financial-chart-backdrop');
        if (existingBackdrop && existingBackdrop.parentNode) existingBackdrop.parentNode.removeChild(existingBackdrop);

        expandedChartId = currentlyExpanded ? null : chartId;
        document.body.classList.toggle('modal-active', Boolean(expandedChartId));
        if (!expandedChartId) {
            renderFinancialCharts(displayedView);
            requestAnimationFrame(() => Plotly.Plots.resize(chartId));
            return;
        }

        const backdrop = document.createElement('button');
        backdrop.id = 'financial-chart-backdrop';
        backdrop.type = 'button';
        backdrop.className = 'fixed inset-0 z-[150] bg-gray-900/55 backdrop-blur-sm';
        backdrop.setAttribute('aria-label', 'Close expanded chart');
        backdrop.addEventListener('click', () => toggleExpandedChart(chartId));
        document.body.appendChild(backdrop);

        card.style.position = 'fixed';
        card.style.left = '50%';
        card.style.top = '8vh';
        card.style.width = '92vw';
        card.style.maxWidth = '1200px';
        card.style.height = '84vh';
        card.style.transform = 'translateX(-50%)';
        card.style.zIndex = '160';
        card.style.boxShadow = '0 30px 70px rgba(15, 23, 42, 0.28)';
        card.style.overflow = 'hidden';

        const chart = document.getElementById(chartId);
        if (chart) chart.style.height = 'calc(84vh - 118px)';
        requestAnimationFrame(() => {
            renderFinancialCharts(displayedView);
            Plotly.Plots.resize(chartId);
        });
    }
'''
          text = text[:start] + replacement + text[end:]

          reset_old = "        expandedChartId = null;\n        document.body.classList.remove('modal-active');\n        const existingBackdrop = document.getElementById('financial-chart-backdrop');"
          reset_new = "        expandedChartId = null;\n        document.body.classList.remove('modal-active');\n        document.querySelectorAll('.financial-card').forEach(clearExpandedCardStyles);\n        const existingBackdrop = document.getElementById('financial-chart-backdrop');"
          if reset_old not in text:
              raise SystemExit('reset anchor not found')
          text = text.replace(reset_old, reset_new, 1)

          path.write_text(text)
          PY

          node --check sethistock-financial-history.js
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git rm .github/workflows/tmp-phase4a-financial-layout-fix.yml
          git add sethistock-financial-history.js
          git commit -m "Refine financial chart sizing and expand view"
          git push origin phase4a-financial-metrics
