name: Temporary Phase 4A financial layout runner

on:
  push:
    branches:
      - phase4a-financial-metrics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-metrics
          fetch-depth: 0
      - run: python .github/phase4a_financial_layout_patch.py
      - run: node --check sethistock-financial-history.js
      - run: |
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git rm .github/phase4a_financial_layout_patch.py .github/workflows/tmp-phase4a-financial-layout-runner.yml
          git add sethistock-financial-history.js
          git commit -m "Refine financial chart sizing and expand view"
          git push origin phase4a-financial-metrics
