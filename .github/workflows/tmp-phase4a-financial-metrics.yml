name: Temporary Phase 4A financial metrics

on:
  push:
    branches: [phase4a-financial-metrics]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-metrics
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/tmp_patch_phase4a_financial_metrics.py
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethistock.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
              f.write(inline)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          print('INLINE_JS_OK')
          PY
      - name: Commit and clean temporary files
        run: |
          rm -f .github/workflows/tmp-phase4a-financial-metrics.yml .github/scripts/tmp_patch_phase4a_financial_metrics.py
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock.html sethistock-financial-history.js .github/workflows/tmp-phase4a-financial-metrics.yml .github/scripts/tmp_patch_phase4a_financial_metrics.py
          git commit -m "Redesign Key Financial Metrics controls and charts"
          git push origin phase4a-financial-metrics
