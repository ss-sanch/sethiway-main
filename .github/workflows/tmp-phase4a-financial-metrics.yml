name: Temporary Phase 4A financial metrics

on:
  push:
    branches: [phase4a-financial-metrics]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-metrics
          fetch-depth: 0
      - name: Patch Key Financial Metrics UI and behaviour
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('sethistock.html')
          text = html.read_text()
          text = text.replace(".tf-btn.active, .type-btn.active, .financial-period-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }", ".tf-btn.active, .type-btn.active, .financial-period-btn.active, .financial-window-btn.active { background-color: #2563eb; color: white; border-color: #2563eb; }")
          old_controls = '''                    <div id="financial-period-controls" class="flex space-x-1 bg-gray-100 p-1 rounded-lg border border-gray-200" aria-label="Financial history period">
                        <button type="button" class="financial-period-btn active px-4 py-1.5 text-xs sm:text-sm font-bold rounded-md text-gray-600 transition" data-financial-period="annual">Annual</button>
                        <button type="button" class="financial-period-btn px-4 py-1.5 text-xs sm:text-sm font-bold rounded-md text-gray-600 transition" data-financial-period="quarterly">Quarterly</button>
                        <button type="button" class="financial-period-btn px-4 py-1.5 text-xs sm:text-sm font-bold rounded-md text-gray-600 transition" data-financial-period="ttm">TTM</button>
                    </div>'''
          new_controls = '''                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                        <div id="financial-period-controls" class="flex space-x-1 bg-gray-100 p-1 rounded-lg border border-gray-200" aria-label="Financial history period">
                            <button type="button" class="financial-period-btn active px-4 py-1.5 text-xs sm:text-sm font-bold rounded-md text-gray-600 transition" data-financial-period="annual">Annual</button>
                            <button type="button" class="financial-period-btn px-4 py-1.5 text-xs sm:text-sm font-bold rounded-md text-gray-600 transition" data-financial-period="quarterly">Quarterly</button>
                            <button type="button" class="financial-period-btn px-4 py-1.5 text-xs sm:text-sm font-bold rounded-md text-gray-600 transition" data-financial-period="ttm">TTM</button>
                        </div>
                        <div id="financial-window-controls" class="flex space-x-1 bg-gray-100 p-1 rounded-lg border border-gray-200" aria-label="Financial history window">
                            <button type="button" class="financial-window-btn px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 transition" data-financial-window="1">1Y</button>
                            <button type="button" class="financial-window-btn px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 transition" data-financial-window="3">3Y</button>
                            <button type="button" class="financial-window-btn px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 transition" data-financial-window="5">5Y</button>
                            <button type="button" class="financial-window-btn px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 transition" data-financial-window="10">10Y</button>
                            <button type="button" class="financial-window-btn active px-3 py-1.5 text-xs font-bold rounded-md text-gray-600 transition" data-financial-window="max">MAX</button>
                        </div>
                    </div>'''
          if old_controls not in text:
              raise SystemExit('financial period controls block not found')
          text = text.replace(old_controls, new_controls, 1)
          html.write_text(text)

          js = Path('sethistock-financial-history.js')
          text = js.read_text()
          text = text.replace("    let desiredPeriod = 'annual';\n", "    let desiredPeriod = 'annual';\n    let desiredWindow = 'max';\n    let expandedChartId = null;\n    let prefetchGeneration = 0;\n")
          text = text.replace("        if (points.length < 2) return { '1Y': '-', '2Y': '-', '3Y': '-', 'MAX': '-' };", "        if (points.length < 2) return { '1Y': '-', '3Y': '-', '5Y': '-', 'MAX': '-' };")
          text = text.replace("        [1, 2, 3].forEach(years => {", "        [1, 3, 5].forEach(years => {")
          shell_pattern = re.compile(r"\n        if \(container\.dataset\?\.phase2eReady !== '1'\) \{.*?\n        \}", re.S)
          shell_replacement = '''
        if (container.dataset?.phase2eReady !== '1') {
            let html = '';
            cards.forEach(card => {
                html += `
                    <div class="financial-card bg-white px-5 pt-5 pb-4 rounded-2xl shadow-sm border border-gray-200 flex flex-col min-h-[330px] relative" data-financial-card="${card.id}">
                        <div class="flex items-center justify-between gap-3 mb-1">
                            <h4 class="text-sm font-bold text-gray-500 uppercase tracking-widest">${card.title}</h4>
                            <div class="flex items-center gap-2">
                                <span id="fin-period-${card.id}" class="px-2 py-1 rounded-md bg-gray-50 border border-gray-100 text-[9px] font-black text-gray-400 uppercase tracking-widest">${periodLabel}</span>
                                <button type="button" class="financial-expand-btn inline-flex h-7 w-7 items-center justify-center rounded-lg border border-gray-200 bg-white text-gray-400 hover:text-blue-600 hover:border-blue-300 hover:bg-blue-50 transition" data-chart-id="${card.id}" aria-label="Expand ${card.title} chart" title="Expand chart">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3M16 21h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                                </button>
                            </div>
                        </div>
                        <div id="${card.id}" class="h-52 w-full mt-1"></div>
                        <div class="grid grid-cols-4 gap-2 mt-2 pt-3 border-t border-gray-100">
                            <div class="text-center"><p class="text-[9px] text-gray-400 font-bold uppercase">1Y CAGR</p><p id="fin-growth-${card.id}-1Y" class="font-semibold text-xs text-gray-400">-</p></div>
                            <div class="text-center"><p class="text-[9px] text-gray-400 font-bold uppercase">3Y CAGR</p><p id="fin-growth-${card.id}-3Y" class="font-semibold text-xs text-gray-400">-</p></div>
                            <div class="text-center"><p class="text-[9px] text-gray-400 font-bold uppercase">5Y CAGR</p><p id="fin-growth-${card.id}-5Y" class="font-semibold text-xs text-gray-400">-</p></div>
                            <div class="text-center"><p class="text-[9px] text-gray-400 font-bold uppercase">MAX</p><p id="fin-growth-${card.id}-MAX" class="font-semibold text-xs text-gray-400">-</p></div>
                        </div>
                    </div>`;
            });
            container.innerHTML = html;
            if (container.dataset) container.dataset.phase2eReady = '1';
            bindExpandButtons();
        }'''
          text, count = shell_pattern.subn(shell_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'financial card shell replacement count={count}')
          text = text.replace("            ['1Y', '2Y', '3Y', 'MAX'].forEach(horizon => {", "            ['1Y', '3Y', '5Y', 'MAX'].forEach(horizon => {")
          anchor = '''    function growthColour(value) {
        if (!value || value === 'N/A' || value === '-') return 'text-gray-400';
        return value.startsWith('-') ? 'text-red-500' : 'text-green-500';
    }
'''
          addition = '''

    function syncWindowControls(windowValue) {
        document.querySelectorAll('.financial-window-btn').forEach(button => {
            button.classList.toggle('active', String(button.dataset.financialWindow) === String(windowValue));
        });
    }

    function filterPointsToWindow(points, windowValue = desiredWindow) {
        if (!Array.isArray(points) || !points.length || windowValue === 'max') return points || [];
        const years = Number(windowValue);
        if (!Number.isFinite(years) || years <= 0) return points;
        const latestDate = new Date(points[points.length - 1]?.end);
        if (Number.isNaN(latestDate.getTime())) return points;
        const cutoff = new Date(latestDate);
        cutoff.setUTCFullYear(cutoff.getUTCFullYear() - years);
        return points.filter(point => {
            const date = new Date(point?.end);
            return !Number.isNaN(date.getTime()) && date >= cutoff;
        });
    }

    function toggleExpandedChart(chartId) {
        const card = document.querySelector(`[data-financial-card="${chartId}"]`);
        if (!card) return;
        const currentlyExpanded = expandedChartId === chartId;
        document.querySelectorAll('.financial-card').forEach(node => {
            node.classList.remove('fixed', 'inset-4', 'md:inset-10', 'z-[160]', 'shadow-2xl', 'overflow-hidden');
            const chartNode = node.querySelector('[id^="ind-"]');
            if (chartNode) chartNode.style.height = '';
        });
        document.getElementById('financial-chart-backdrop')?.remove();
        expandedChartId = currentlyExpanded ? null : chartId;
        document.body.classList.toggle('modal-active', Boolean(expandedChartId));
        if (!expandedChartId) {
            renderFinancialCharts(displayedView);
            return;
        }
        const backdrop = document.createElement('button');
        backdrop.id = 'financial-chart-backdrop';
        backdrop.type = 'button';
        backdrop.className = 'fixed inset-0 z-[150] bg-gray-900/55 backdrop-blur-sm';
        backdrop.setAttribute('aria-label', 'Close expanded chart');
        backdrop.addEventListener('click', () => toggleExpandedChart(chartId));
        document.body.appendChild(backdrop);
        card.classList.add('fixed', 'inset-4', 'md:inset-10', 'z-[160]', 'shadow-2xl', 'overflow-hidden');
        const chart = document.getElementById(chartId);
        if (chart) chart.style.height = 'calc(100vh - 210px)';
        requestAnimationFrame(() => Plotly.Plots.resize(chartId));
    }

    function bindExpandButtons() {
        document.querySelectorAll('.financial-expand-btn').forEach(button => {
            button.addEventListener('click', () => toggleExpandedChart(button.dataset.chartId));
        });
    }
'''
          if anchor not in text:
              raise SystemExit('growthColour anchor not found')
          text = text.replace(anchor, anchor + addition, 1)
          idx = text.index('    function traceForMetric')
          sub = text[idx:]
          sub = sub.replace("        const points = validMetricPoints(view, key);", "        const points = filterPointsToWindow(validMetricPoints(view, key));", 1)
          text = text[:idx] + sub
          text = text.replace("            margin: { t: 12, b: showLegend ? 45 : 34, l: 48, r: 10 },", "            margin: { t: 8, b: showLegend ? 42 : 30, l: 54, r: 16 },", 1)
          text = text.replace("            trace.marker = { color: colour, line: { width: 0 } };", "            trace.marker = { color: colour, line: { width: 0 } };\n            trace.textposition = 'outside';\n            trace.textfont = { color: '#334155', size: 10 };\n            trace.cliponaxis = false;")
          text = text.replace("        renderFinancialCards(view);\n        renderFinancialCharts(view);", "        renderFinancialCards(view);\n        syncWindowControls(desiredWindow);\n        renderFinancialCharts(view);", 1)
          load_anchor = '    async function loadFinancialHistory(period = desiredPeriod) {'
          helper = '''    async function fetchFinancialHistoryIntoCache(ticker, period, generation = prefetchGeneration) {
        const key = `${ticker}|${period}`;
        const cached = financialMemoryCache.get(key);
        if (cached && Date.now() - cached.savedAt < FINANCIAL_CACHE_TTL_MS) return cached.view;
        try {
            const query = new URLSearchParams({ period, metrics: SEC_METRICS.join(','), limit: '200' });
            const payload = await fetchJsonWithRetry(`${API_URL}/api/sec/${encodeURIComponent(ticker)}/fundamentals/series?${query.toString()}`, {}, 1);
            if (generation !== prefetchGeneration || ticker !== String(state.ticker || '').trim().toUpperCase()) return null;
            const view = transformSecPayload(payload);
            if (!view.metricPoints.revenue?.length) return null;
            rememberFinancialView(key, view);
            return view;
        } catch (error) {
            console.debug(`Phase 4A ${period} prefetch skipped for ${ticker}:`, error);
            return null;
        }
    }

    function prefetchOtherPeriods(ticker, loadedPeriod) {
        const generation = prefetchGeneration;
        const periods = ['annual', 'quarterly', 'ttm'].filter(period => period !== loadedPeriod);
        const run = () => periods.reduce((promise, period) => promise.then(() => fetchFinancialHistoryIntoCache(ticker, period, generation)), Promise.resolve());
        if ('requestIdleCallback' in window) requestIdleCallback(run, { timeout: 1200 });
        else setTimeout(run, 250);
    }

'''
          if load_anchor not in text:
              raise SystemExit('load anchor not found')
          text = text.replace(load_anchor, helper + load_anchor, 1)
          success = "            rememberFinancialView(key, view);\n            if (ticker === String(state.ticker || '').trim().toUpperCase() && desiredPeriod === period) {"
          if success not in text:
              raise SystemExit('success anchor not found')
          text = text.replace(success, "            rememberFinancialView(key, view);\n            prefetchOtherPeriods(ticker, period);\n            if (ticker === String(state.ticker || '').trim().toUpperCase() && desiredPeriod === period) {", 1)
          reset = "        requestId += 1;\n        financialTicker = ticker;"
          if reset not in text:
              raise SystemExit('reset anchor not found')
          text = text.replace(reset, "        requestId += 1;\n        prefetchGeneration += 1;\n        desiredWindow = 'max';\n        expandedChartId = null;\n        document.body.classList.remove('modal-active');\n        document.getElementById('financial-chart-backdrop')?.remove();\n        financialTicker = ticker;", 1)
          listener_anchor = "    // Expose a tiny debugging surface for production smoke tests without coupling the\n"
          listeners = '''    document.querySelectorAll('.financial-window-btn').forEach(button => {
        button.addEventListener('click', () => {
            const nextWindow = button.dataset.financialWindow || 'max';
            if (String(nextWindow) === String(desiredWindow)) return;
            desiredWindow = nextWindow;
            syncWindowControls(desiredWindow);
            if (displayedView) renderFinancialCharts(displayedView);
        });
    });

    document.addEventListener('keydown', event => {
        if (event.key === 'Escape' && expandedChartId) toggleExpandedChart(expandedChartId);
    });

'''
          if listener_anchor not in text:
              raise SystemExit('listener anchor not found')
          text = text.replace(listener_anchor, listeners + listener_anchor, 1)
          js.write_text(text)
          assert '5Y CAGR' in text
          assert 'financial-expand-btn' in text
          assert 'prefetchOtherPeriods' in text
          assert 'filterPointsToWindow' in text
          print('PHASE4A_FINANCIAL_METRICS_PATCH_OK')
          PY
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path('sethistock.html').read_text()
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S)
          inline = '\n'.join(s for s in scripts if s.strip())
          with tempfile.NamedTemporaryFile('w', suffix='.js', delete=False) as f:
              f.write(inline)
              name = f.name
          subprocess.run(['node', '--check', name], check=True)
          print('INLINE_JS_OK')
          PY
      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/tmp-phase4a-financial-metrics.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock.html sethistock-financial-history.js .github/workflows/tmp-phase4a-financial-metrics.yml
          git commit -m "Redesign Key Financial Metrics controls and charts"
          git push origin phase4a-financial-metrics
