name: Temporary Phase 4A info fix
on:
  push:
    branches: [phase4a-insights-polish]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-insights-polish
          fetch-depth: 0
      - name: Fix guide padding
        run: |
          python -c "from pathlib import Path; p=Path('sethistock.html'); t=p.read_text(); assert 'shadow-2xl p8 max-w-4xl' in t; p.write_text(t.replace('shadow-2xl p8 max-w-4xl','shadow-2xl p-8 max-w-4xl',1))"
      - name: Commit fix and remove temporary workflow
        run: |
          rm .github/workflows/tmp-phase4a-info-fix.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock.html .github/workflows/tmp-phase4a-info-fix.yml
          git commit -m "Fix Insights guide padding"
          git push origin phase4a-insights-polish
