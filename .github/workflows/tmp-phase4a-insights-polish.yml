name: Temporary Phase 4A Insights polish

on:
  push:
    branches: [phase4a-insights-polish]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-insights-polish
          fetch-depth: 0
      - name: Patch Insights and Stats polish
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('sethistock.html')
          text = p.read_text()

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              assert count == 1, f'{label}: expected 1 match, found {count}'
              text = text.replace(old, new, 1)

          score_replacement = '''<button type="button" onclick="toggleModal('score-modal')" aria-label="Open Sethi Score breakdown" title="View Sethi Score breakdown" class="group flex flex-col items-center justify-center p-3 bg-gray-50 rounded-xl border border-gray-200 hidden md:flex cursor-pointer transition-all hover:bg-blue-50/70 hover:border-blue-300 hover:shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-200">
                            <div class="flex items-center space-x-1">
                                <span class="text-[10px] text-gray-400 group-hover:text-blue-600 font-bold tracking-widest uppercase transition-colors">Sethi Score</span>
                                <span class="text-gray-400 group-hover:text-blue-600 transition-colors" aria-hidden="true">
                                    <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 18l6-6-6-6" /></svg>
                                </span>
                            </div>
                            <span id="sethi-score" class="text-3xl font-black mt-1">0/100</span>
                            <span class="mt-0.5 text-[9px] font-black uppercase tracking-widest text-blue-600 opacity-75 group-hover:opacity-100 transition-opacity">View breakdown</span>
                        </button>'''
          score_pattern = re.compile(r'<div class="flex flex-col items-center justify-center p-3 bg-gray-50 rounded-xl border border-gray-200 hidden md:flex">.*?<span id="sethi-score" class="text-3xl font-black mt-1">0/100</span>\s*</div>', re.S)
          text, count = score_pattern.subn(score_replacement, text, count=1)
          assert count == 1, f'Sethi Score button: expected 1 match, found {count}'

          replace_once('bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col relative h-full', 'bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col relative self-start h-fit', 'Insights card height')
          replace_once('flex-grow flex flex-col justify-between space-y-4', 'flex flex-col space-y-5', 'Insights spacing')

          beta_row = '<div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Beta</span><span id="stat-beta" class="text-sm font-black text-gray-900">--</span></div>'
          ann_vol_row = '<div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Ann. Volatility</span><span id="stat-vol" class="text-sm font-black text-gray-900">--</span></div>'
          replace_once(beta_row, beta_row + '\n                  ' + ann_vol_row, 'Annualised volatility row')
          replace_once('<div class="flex justify-between items-center py-1"><span id="stat-balance-label" class="text-sm font-bold text-gray-500">Net Debt/EBITDA</span><span id="stat-balance" class="text-sm font-black text-gray-900">--</span></div>', '<div class="col-span-2 flex justify-between items-center py-1"><span id="stat-balance-label" class="text-sm font-bold text-gray-500">Net Debt/EBITDA</span><span id="stat-balance" class="text-sm font-black text-gray-900">--</span></div>', 'Balance row span')

          replace_once('<span id="stat-earn" class="text-sm font-black text-gray-900 text-right">--</span></div><p id="stat-earn-countdown" class="text-[10px] font-bold text-gray-400 text-right mt-0.5"></p>', '<span class="inline-flex items-center gap-1.5"><span id="stat-earn" class="text-sm font-black text-gray-900 text-right">--</span><span id="stat-earn-countdown" class="hidden px-1.5 py-0.5 rounded-full bg-purple-50 text-[9px] font-black text-purple-700 whitespace-nowrap"></span></span></div>', 'Earnings timing chip')
          replace_once('<span id="stat-exdiv" class="text-sm font-black text-gray-900 text-right">--</span></div><p id="stat-exdiv-countdown" class="text-[10px] font-bold text-gray-400 text-right mt-0.5"></p>', '<span class="inline-flex items-center gap-1.5"><span id="stat-exdiv" class="text-sm font-black text-gray-900 text-right">--</span><span id="stat-exdiv-countdown" class="hidden px-1.5 py-0.5 rounded-full bg-purple-50 text-[9px] font-black text-purple-700 whitespace-nowrap"></span></span></div>', 'Ex-dividend timing chip')

          old_change = "                changeEl.innerText = data.change > 0 ? `+${data.change.toFixed(2)}` : data.change.toFixed(2);"
          new_change = '''                const displayedPriceText = document.getElementById('display-price').innerText;
                const quoteCurrencySymbol = (displayedPriceText.match(/^[^\\d+\\-.,\\s]+/) || ['$'])[0];
                const absDailyChange = Math.abs(Number(data.change) || 0).toFixed(2);
                changeEl.innerText = data.change > 0 ? `+${quoteCurrencySymbol}${absDailyChange}` : (data.change < 0 ? `-${quoteCurrencySymbol}${absDailyChange}` : `${quoteCurrencySymbol}${absDailyChange}`);'''
          replace_once(old_change, new_change, 'Daily price change currency')

          beta_mapping = "          injectText('stat-beta', data.stats.beta || 'N/A');"
          replace_once(beta_mapping, beta_mapping + "\n          const annualisedVolatility = asFiniteNumber(data.risk_profile?.annualized_volatility);\n          injectText('stat-vol', Number.isFinite(annualisedVolatility) ? `${annualisedVolatility.toFixed(1)}%` : 'N/A');", 'Annualised volatility mapping')

          replace_once("              if (!Number.isFinite(parsed)) { el.innerText = ''; return; }", "              if (!Number.isFinite(parsed)) { el.innerText = ''; el.classList.add('hidden'); return; }", 'Countdown parse fallback')
          replace_once('              const days = Math.ceil((target - today) / 86400000);', '              const days = Math.round((target - today) / 86400000);', 'Countdown day calculation')
          replace_once("              el.innerText = days > 0 ? `in ${days} day${days === 1 ? '' : 's'}` : days === 0 ? 'today' : '';", "              if (days > 0) el.innerText = `in ${days}d`;\n              else if (days === 0) el.innerText = 'today';\n              else el.innerText = `${Math.abs(days)}d ago`;\n              el.classList.remove('hidden');", 'Countdown output')

          old_stat_boxes = 'const statBoxes = ["current-price", "pe-ratio", "market-cap", "fcf-yield", "sethi-score", "dcf-target", "gordon-growth", "graham-number", "beta", "dividend-yield", "ev-ebitda", "profit-margin", "roe", "stat-pe-pair", "stat-eps-pair", "stat-rev-growth", "stat-net-margin", "stat-balance"];'
          new_stat_boxes = 'const statBoxes = ["current-price", "pe-ratio", "market-cap", "fcf-yield", "sethi-score", "dcf-target", "gordon-growth", "graham-number", "beta", "dividend-yield", "ev-ebitda", "profit-margin", "roe", "stat-pe-pair", "stat-eps-pair", "stat-rev-growth", "stat-net-margin", "stat-vol", "stat-balance"];'
          replace_once(old_stat_boxes, new_stat_boxes, 'Skeleton IDs')

          replace_once('>Risk & Yield</h4>', '>Risk & Capital</h4>', 'Risk glossary heading')
          beta_glossary = '<li><strong class="text-blue-600">Beta:</strong> A measure of volatility. A Beta > 1 means the stock is more volatile than the S&P 500; < 1 means it is less volatile.</li>'
          replace_once(beta_glossary, '<li><strong class="text-blue-600">Beta:</strong> Sensitivity to broad market moves; above 1 means the stock has historically moved more than the market.</li>\n                        <li><strong class="text-blue-600">Annualised Volatility:</strong> Annualised standard deviation of recent daily returns, showing the stock\'s realised price variability.</li>', 'Risk glossary beta')
          replace_once('<li><strong class="text-green-600">FCF Yield:</strong> Free Cash Flow Yield. High numbers indicate the company is generating massive cash relative to its valuation.</li>', '<li><strong class="text-blue-600">Net Debt/EBITDA or Net Cash:</strong> Balance-sheet leverage when debt exceeds cash; otherwise the net cash position is shown directly.</li>', 'Risk glossary balance metric')
          text = text.replace('<li><strong class="text-blue-600">% From 200MA:</strong>', '<li><strong class="text-blue-600">vs 200D MA:</strong>', 1)
          text = text.replace('<li><strong class="text-blue-600">% From 52W High:</strong>', '<li><strong class="text-blue-600">vs 52W High:</strong>', 1)
          text = text.replace('The estimated date the company will report quarterly financials, driving major price volatility.', 'The estimated reporting date, with a relative timing chip showing how far away it is or how long ago the supplied date passed.', 1)

          p.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('sethistock.html').read_text()
          checks = ['View breakdown', 'self-start h-fit', 'Ann. Volatility', 'stat-vol', 'quoteCurrencySymbol', 'absDailyChange', 'd ago', 'Risk & Capital']
          for check in checks:
              assert check in html, check
          blocks = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', html, flags=re.S)
          Path('/tmp/sethistock-inline.js').write_text('\n'.join(blocks))
          print('PHASE4A_POLISH_STATIC_OK')
          PY
          node --check /tmp/sethistock-inline.js
      - name: Commit polished UI and remove temporary workflow
        run: |
          rm .github/workflows/tmp-phase4a-insights-polish.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock.html .github/workflows/tmp-phase4a-insights-polish.yml
          git commit -m "Polish Phase 4A Insights and SethiScore UI"
          git push origin phase4a-insights-polish
