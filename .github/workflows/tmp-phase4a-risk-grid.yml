name: Temporary Phase 4A risk grid

on:
  push:
    branches: [phase4a-insights-polish]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-insights-polish
          fetch-depth: 0
      - name: Patch risk grid and card height
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('sethistock.html')
          text=p.read_text()
          def one(old,new,label):
              global text
              c=text.count(old)
              assert c==1, f'{label}: {c}'
              text=text.replace(old,new,1)

          one('class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col relative self-start h-fit"','class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col relative h-full"','card height')
          one('class="flex flex-col space-y-5"','class="flex-grow flex flex-col justify-between space-y-4"','section spacing')

          old='''                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Beta</span><span id="stat-beta" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Ann. Volatility</span><span id="stat-vol" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-red-500">Short Interest</span><span id="stat-short" class="text-sm font-black text-red-600">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Dividend Yield</span><span id="stat-div" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="col-span-2 flex justify-between items-center py-1"><span id="stat-balance-label" class="text-sm font-bold text-gray-500">Net Debt/EBITDA</span><span id="stat-balance" class="text-sm font-black text-gray-900">--</span></div>'''
          new='''                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Beta</span><span id="stat-beta" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Ann. Volatility</span><span id="stat-vol" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Daily VaR (95%)</span><span id="stat-var" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-red-500">Short Interest</span><span id="stat-short" class="text-sm font-black text-red-600">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span class="text-sm font-bold text-gray-500">Dividend Yield</span><span id="stat-div" class="text-sm font-black text-gray-900">--</span></div>\n                  <div class="flex justify-between items-center py-1"><span id="stat-balance-label" class="text-sm font-bold text-gray-500">Net Debt/EBITDA</span><span id="stat-balance" class="text-sm font-black text-gray-900">--</span></div>'''
          one(old,new,'risk grid')

          one("const annualisedVolatility = asFiniteNumber(data.risk_profile?.annualized_volatility);\n          injectText('stat-vol', Number.isFinite(annualisedVolatility) ? `${annualisedVolatility.toFixed(1)}%` : 'N/A');\n          injectText('stat-short', data.stats.short_interest || 'N/A');",
              "const annualisedVolatility = asFiniteNumber(data.risk_profile?.annualized_volatility);\n          injectText('stat-vol', Number.isFinite(annualisedVolatility) ? `${annualisedVolatility.toFixed(1)}%` : 'N/A');\n          const dailyVar95 = asFiniteNumber(data.risk_profile?.daily_var_95);\n          injectText('stat-var', Number.isFinite(dailyVar95) ? `${dailyVar95.toFixed(2)}%` : 'N/A');\n          injectText('stat-short', data.stats.short_interest || 'N/A');",
              'VaR mapping')

          text=text.replace('"stat-vol", "stat-balance"','"stat-vol", "stat-var", "stat-balance"',1)
          text=text.replace('<li><strong class="text-blue-600">Annualised Volatility:</strong> Annualised standard deviation of recent daily returns, showing the stock\'s realised price variability.</li>', '<li><strong class="text-blue-600">Annualised Volatility:</strong> Annualised standard deviation of recent daily returns, showing the stock\'s realised price variability.</li>\n              <li><strong class="text-blue-600">Daily VaR (95%):</strong> One-day loss threshold expected to be exceeded on roughly 5% of trading days under the model\'s historical assumptions.</li>',1)
          p.write_text(text)
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('sethistock.html').read_text()
          for s in ['Daily VaR (95%)','stat-var','flex-grow flex flex-col justify-between space-y-4','relative h-full']:
              assert s in html, s
          blocks=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.S)
          Path('/tmp/inline.js').write_text('\n'.join(blocks))
          print('PHASE4A_RISK_GRID_STATIC_OK')
          PY
          node --check /tmp/inline.js
      - name: Commit UI adjustment and remove temporary workflow
        run: |
          rm .github/workflows/tmp-phase4a-risk-grid.yml
          git config user.name "ss-sanch"
          git config user.email "mlgsanchit@gmail.com"
          git add sethistock.html .github/workflows/tmp-phase4a-risk-grid.yml
          git commit -m "Refine Phase 4A risk grid and card height"
          git push origin HEAD:phase4a-insights-polish
