name: Temporary unified initial dashboard patch
on:
  push:
    paths:
      - '.github/workflows/tmp-phase4a-unified-initial-dashboard.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-initial-dashboard-unified
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply frontend initial-render patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def load(path):
              raw = Path(path).read_bytes()
              crlf = b'\r\n' in raw
              return raw.decode('utf-8').replace('\r\n', '\n'), crlf

          def save(path, text, crlf):
              if crlf:
                  text = text.replace('\n', '\r\n')
              Path(path).write_bytes(text.encode('utf-8'))

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          # ---------- sethistock-financial-history.js ----------
          path = 'sethistock-financial-history.js'
          text, crlf = load(path)
          marker = '''    function metricPointsFromAligned(view, key) {\n'''
          prime_fn = '''    function primeInitialData(ticker, payload) {\n        const symbol = canonicalSupplementaryTicker(ticker);\n        if (!looksLikeTicker(symbol) || !payload || typeof payload !== 'object') return;\n        const research = payload.research && typeof payload.research === 'object' ? payload.research : payload;\n        if (!research || typeof research !== 'object') return;\n        fastResearchCache.set(symbol, research);\n        if (canonicalSupplementaryTicker(financialTicker) === symbol || !financialTicker) {\n            researchData = research;\n            researchTicker = symbol;\n        }\n    }\n\n'''
          text = replace_once(text, marker, prime_fn + marker, 'financial initial data primer')

          old_draw = '''        // Keep the existing short history visible instantly. Then stage the two\n        // supplementary requests before the heavy long-run SEC hydration so Render\n        // is not hit by a burst of expensive requests at analysis start.\n        renderFinancialCharts(fallbackView);\n        displayedView = fallbackView;\n        setStatus('Loading recent research and EBITDA…', 'loading');\n\n        const generation = prefetchGeneration;\n        const symbol = canonicalSupplementaryTicker(ticker);\n        (async () => {\n            try {\n                await loadFinancialResearch(symbol, generation);\n            } catch (_) {}\n\n            if (generation !== prefetchGeneration || canonicalSupplementaryTicker(financialTicker) !== symbol) return;\n\n            try {\n                await requestFastEbitda(symbol);\n            } catch (_) {}\n\n            if (generation !== prefetchGeneration || canonicalSupplementaryTicker(financialTicker) !== symbol) return;\n            if (fallbackView?.sourceType === 'legacy') {\n                applyFastEbitdaFallback(symbol, fallbackView);\n                renderFinancialCards(fallbackView);\n                renderFinancialCharts(fallbackView);\n                displayedView = fallbackView;\n            }\n\n            setStatus('Loading long-run SEC history…', 'loading');\n            loadFinancialHistory('annual').catch(() => null);\n        })();\n'''
          new_draw = '''        // The main stock payload now contains recent EBITDA plus P/E / earnings\n        // research, so all 12 cards render in one pass. Long-run SEC history upgrades\n        // the same cards independently and never blocks the first financial render.\n        renderFinancialCharts(fallbackView);\n        displayedView = fallbackView;\n        setStatus('Loading long-run SEC history…', 'loading');\n        loadFinancialHistory('annual').catch(() => null);\n'''
          text = replace_once(text, old_draw, new_draw, 'financial unified initial render')

          old_debug = '''    window.SethiStockFinancialHistory = {\n        get period() { return desiredPeriod; },\n        get source() { return displayedView?.sourceType || null; },\n        get periodCount() { return displayedView?.periodCount || 0; },\n        load: loadFinancialHistory\n    };\n'''
          new_debug = '''    window.SethiStockFinancialHistory = {\n        get period() { return desiredPeriod; },\n        get source() { return displayedView?.sourceType || null; },\n        get periodCount() { return displayedView?.periodCount || 0; },\n        primeInitialData,\n        load: loadFinancialHistory\n    };\n'''
          text = replace_once(text, old_debug, new_debug, 'financial public primer')
          save(path, text, crlf)

          # ---------- sethistock.html ----------
          path = 'sethistock.html'
          text, crlf = load(path)
          old_clean = '''                let cleanFin = { years: [], revenue: [], net: [], ebitda: [], gross_margin: [], op_margin: [], net_margin: [], fcf: [], ocf: [], capex: [], cash: [], debt: [], shares: [] };\n'''
          new_clean = '''                if (data.research && window.SethiStockFinancialHistory?.primeInitialData) {\n                    window.SethiStockFinancialHistory.primeInitialData(state.ticker, { research: data.research });\n                }\n\n                let cleanFin = { years: [], revenue: [], net: [], ebitda: [], gross_margin: [], op_margin: [], net_margin: [], fcf: [], ocf: [], capex: [], cash: [], debt: [], shares: [] };\n'''
          text = replace_once(text, old_clean, new_clean, 'stock research primer')

          old_render = '''                dash.classList.remove('hidden');\n                injectFinancialHTML(cleanFin);\n\n                setTimeout(async () => {\n                    await chartPromise;\n                    if (!state.chartData) await fetchChart().catch(() => null);\n                    drawFinancials(cleanFin);\n                    loadPeers(data.peers);\n                    loadInsiders(data.insiders);\n                    dash.classList.add('opacity-100'); \n                }, 150);\n'''
          new_render = '''                dash.classList.remove('hidden');\n                injectFinancialHTML(cleanFin);\n\n                // The main analysis already fetched five years of daily prices. Use its\n                // one-year preview immediately if the dedicated price-chart request is\n                // still in flight, rather than leaving Price Action blank.\n                if (!state.chartData && state.period === '1y' && state.interval === '1d' && data.chart_preview) {\n                    const preview = normaliseChartData(data.chart_preview);\n                    if (preview.closes.length) {\n                        const previewKey = `${state.ticker}|1y|1d`;\n                        rememberChart(previewKey, preview);\n                        state.chartData = preview;\n                        renderPeriodReturn();\n                        drawPriceChart();\n                    }\n                }\n\n                // Financials no longer wait for Price Action. They render as soon as the\n                // main analysis arrives; the independent chart request can finish later.\n                setTimeout(() => {\n                    drawFinancials(cleanFin);\n                    loadPeers(data.peers);\n                    loadInsiders(data.insiders);\n                    dash.classList.add('opacity-100');\n\n                    chartPromise.then(() => {\n                        if (!state.chartData) fetchChart().catch(() => null);\n                    }).catch(() => null);\n                }, 0);\n'''
          text = replace_once(text, old_render, new_render, 'stock decouple price and financial render')
          save(path, text, crlf)
          PY
      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          html = Path('sethistock.html').read_text()
          js = Path('sethistock-financial-history.js').read_text()
          assert 'primeInitialData' in js
          assert "Loading recent research and EBITDA" not in js
          assert 'data.chart_preview' in html
          assert 'await chartPromise' not in html
          print('PHASE4A_UNIFIED_INITIAL_FRONTEND_OK')
          PY
      - name: Commit frontend patch and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-phase4a-unified-initial-dashboard.yml
          git add sethistock-financial-history.js sethistock.html
          git commit -m 'Phase 4A: render all financial cards together'
          git push origin HEAD:phase4a-initial-dashboard-unified
