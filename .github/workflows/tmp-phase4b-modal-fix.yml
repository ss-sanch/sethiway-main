name: Temporary Phase 4B modal fix validation

on:
  push:
    branches: [phase4b-revenue-by-segment]
    paths:
      - 'tmp_phase4b_modal_fix.py'
      - '.github/workflows/tmp-phase4b-modal-fix.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4b-revenue-by-segment
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply modal and chart sizing fixes
        run: python tmp_phase4b_modal_fix.py
      - name: Validate JavaScript and modal contracts
        run: |
          node --check sethistock-company-drivers.js
          node --check sethistock-ui-stability.js
          node --check sethiway-history.js
          python - <<'PY'
          from pathlib import Path
          d = Path('sethistock-company-drivers.js').read_text()
          s = Path('sethistock-ui-stability.js').read_text()
          h = Path('sethiway-history.js').read_text()
          assert 'driver-modal-backdrop' in d
          assert 'id="driver-dialog"' in d
          assert 'grid-cols-1 lg:grid-cols-2 xl:grid-cols-3' in d
          assert 'requestAnimationFrame(() => requestAnimationFrame(resolve))' in d
          assert 'Back to Financials' not in d
          assert 'autosize: true' in s and 'width: undefined' in s
          assert 'sethistock-ui-stability.js?v=5' in h
          assert 'sethistock-company-drivers.js?v=4b2' in h
          print('PHASE4B_MODAL_FIX_OK')
          PY
      - name: Commit application changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tmp_phase4b_modal_fix.py .github/workflows/tmp-phase4b-modal-fix.yml
          git add sethistock-company-drivers.js sethistock-ui-stability.js sethiway-history.js
          git commit -m "Fix Revenue Drivers modal and chart sizing"
          git push origin HEAD:phase4b-revenue-by-segment
