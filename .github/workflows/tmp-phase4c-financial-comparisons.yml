name: Temporary Phase 4C financial comparisons validation

on:
  push:
    branches: [phase4c-financial-comparisons-patch]
    paths:
      - 'tmp_phase4c_patch.py'
      - '.github/workflows/tmp-phase4c-financial-comparisons.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4c-financial-comparisons-patch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply Phase 4C patch
        run: python tmp_phase4c_patch.py
      - name: Validate JavaScript and contracts
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          html = Path('sethistock.html').read_text()
          js = Path('sethistock-financial-history.js').read_text()
          assert 'id="research-labs"' not in html
          assert 'href="#research-labs"' not in html
          assert 'data-comparison-period="quarterly"' in html
          assert 'data-comparison-mode="indexed"' in html
          assert 'comp-rev-net-footer' in html and 'comp-ocf-capex-footer' in html
          assert 'renderFinancialComparisons(comparisonView || view);' in js
          assert 'fetchFinancialHistoryIntoCache(ticker, period, prefetchGeneration)' in js
          assert "button.addEventListener('click', () =>" in js
          assert "comparisonPeriod = 'annual'" in js
          assert "comparisonWindow = 'max'" in js
          assert "comparisonMode = 'absolute'" in js
          assert "return null; // Retired legacy UI" in html
          # Performance contract: the comparison feature itself adds no direct fetch/API call.
          phase = js[js.index('function syncComparisonControls'):js.index('function renderFinancialCharts')]
          assert 'fetch(' not in phase
          assert '/api/' not in phase
          print('PHASE4C_FINANCIAL_COMPARISONS_OK')
          PY
      - name: Commit application changes only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f tmp_phase4c_patch.py .github/workflows/tmp-phase4c-financial-comparisons.yml
          git add sethistock.html sethistock-financial-history.js
          git commit -m "Improve Financial Comparisons and retire Research Labs"
          git push origin HEAD:phase4c-financial-comparisons-patch
