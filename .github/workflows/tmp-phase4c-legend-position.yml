name: Temporary Phase 4C legend position validation

on:
  push:
    branches:
      - phase4c-financial-comparisons

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4c-financial-comparisons
          fetch-depth: 0

      - name: Move comparison legends into plot area
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('sethistock-financial-history.js')
          text = path.read_text()
          old = """        const layout = chartLayout({ period: 'annual' }, true);\n        layout.barmode = 'group';\n        layout.xaxis.type = 'category';\n        Plotly.react(id, traces, layout, { displayModeBar: false, responsive: true });\n"""
          new = """        const layout = chartLayout({ period: 'annual' }, true);\n        layout.barmode = 'group';\n        layout.xaxis.type = 'category';\n        // Keep the comparison legend inside the plot instead of spending a full row\n        // beneath the x-axis. Early-period bars are typically smallest, so the upper-left\n        // corner provides a readable key while giving the chart more vertical space.\n        layout.margin = { ...layout.margin, t: 8, b: 24 };\n        layout.legend = {\n            orientation: 'h',\n            x: 0.01,\n            xanchor: 'left',\n            y: 0.99,\n            yanchor: 'top',\n            bgcolor: 'rgba(255,255,255,0.86)',\n            bordercolor: '#e2e8f0',\n            borderwidth: 1,\n            font: { size: 10 }\n        };\n        Plotly.react(id, traces, layout, { displayModeBar: false, responsive: true });\n"""
          if old not in text:
              raise SystemExit('Expected comparison layout block not found')
          text = text.replace(old, new, 1)
          path.write_text(text)
          PY

      - name: Validate JavaScript
        run: |
          node --check sethistock-financial-history.js
          python - <<'PY'
          from pathlib import Path
          text = Path('sethistock-financial-history.js').read_text()
          assert "x: 0.01" in text
          assert "y: 0.99" in text
          assert "b: 24" in text
          print('LEGEND_POSITION_OK')
          PY

      - name: Commit app change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethistock-financial-history.js
          git rm .github/workflows/tmp-phase4c-legend-position.yml
          git commit -m "Move comparison legends inside charts"
          git push origin HEAD:phase4c-financial-comparisons
