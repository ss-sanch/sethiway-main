name: Temporary Phase 4D valuation validation
on:
  push:
    branches: [phase4d-advanced-valuation]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check valuation module
        run: node --check sethistock-valuation-v2.js
      - name: Syntax check loader
        run: node --check sethiway-history.js
      - name: Enforce no valuation network requests
        run: |
          if grep -nE 'fetch\s*\(' sethistock-valuation-v2.js; then
            echo 'Advanced Valuation must not launch its own network requests.'
            exit 1
          fi
      - name: Confirm key valuation features
        run: |
          grep -q 'Reverse DCF' sethistock-valuation-v2.js
          grep -q 'Forward DCF' sethistock-valuation-v2.js
          grep -q 'Scenario Valuation' sethistock-valuation-v2.js
          grep -q 'Rate × Growth' sethistock-valuation-v2.js
          grep -q 'LBO Lab' sethistock-valuation-v2.js
          grep -q 'sethistock-valuation-v2.js?v=4d1' sethiway-history.js
