name: Temporary staged financial hydration patch
on:
  push:
    paths:
      - '.github/workflows/tmp-stage-financial-hydration.yml'
      - 'tmp_stage_financial_hydration.py'
jobs:
  patch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase4a-financial-fast-fallback
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply patch
        run: python tmp_stage_financial_hydration.py
      - name: Validate JavaScript
        run: node --check sethistock-financial-history.js
      - name: Commit application changes and remove temporary tooling
        run: |
          rm -f tmp_stage_financial_hydration.py .github/workflows/tmp-stage-financial-hydration.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sethistock-financial-history.js tmp_stage_financial_hydration.py .github/workflows/tmp-stage-financial-hydration.yml
          git commit -m "Phase 4A: stage supplementary financial hydration safely" || exit 0
          git push origin HEAD:phase4a-financial-fast-fallback
