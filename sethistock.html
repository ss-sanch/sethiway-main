<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SethiStock | Proprietary Analytics</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Arial, sans-serif; background: #f9fafb; color: #111827; }
        .boot { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
        .boot-card { text-align: center; padding: 28px 34px; background: white; border: 1px solid #e5e7eb; border-radius: 18px; box-shadow: 0 10px 30px rgba(17,24,39,.08); }
        .spinner { width: 24px; height: 24px; margin: 0 auto 14px; border: 3px solid #dbeafe; border-top-color: #2563eb; border-radius: 50%; animation: spin .8s linear infinite; }
        .boot-title { font-size: 13px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        .boot-sub { margin-top: 7px; font-size: 12px; color: #6b7280; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="boot" id="boot-state">
        <div class="boot-card">
            <div class="spinner"></div>
            <div class="boot-title">Initialising SethiStock</div>
            <div class="boot-sub">Loading analytics and research tools...</div>
        </div>
    </div>

    <script>
        (async function loadSethiStock() {
            try {
                const response = await fetch('sethistock_core.html?v=20260831', { cache: 'no-store' });
                if (!response.ok) throw new Error(`Core page returned ${response.status}`);
                let html = await response.text();
                const researchScript = '<script src="sethistock-research.js?v=20260831"><\/script>';
                const bodyClose = html.toLowerCase().lastIndexOf('</body>');
                html = bodyClose >= 0
                    ? html.slice(0, bodyClose) + researchScript + html.slice(bodyClose)
                    : html + researchScript;
                document.open();
                document.write(html);
                document.close();
            } catch (error) {
                console.error('Failed to initialise SethiStock:', error);
                document.getElementById('boot-state').innerHTML = `
                    <div class="boot-card">
                        <div class="boot-title">SethiStock could not initialise</div>
                        <div class="boot-sub">The preserved core page is still available.</div>
                        <p style="margin-top:16px"><a href="sethistock_core.html" style="color:#2563eb;font-weight:700">Open SethiStock core</a></p>
                    </div>`;
            }
        })();
    </script>
</body>
</html>
