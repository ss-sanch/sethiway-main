<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SethiStock | Advanced Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased pb-20">

    <nav class="flex justify-between items-center py-6 px-6 md:px-10 bg-white shadow-sm sticky top-0 z-50">
        <a href="index.html" class="flex items-center">
            <img src="logo.png" alt="Sethiway Logo" class="h-10 w-auto invert">
        </a>
        <div class="hidden md:flex space-x-8 text-sm font-semibold uppercase tracking-wide">
            <a href="index.html" class="hover:text-blue-600 transition">Back to Hub</a>
        </div>
    </nav>

    <header class="pt-16 pb-10 flex flex-col justify-center items-center text-center px-6">
        <h1 class="text-4xl md:text-6xl font-black tracking-tight mb-4 text-gray-900">
            SETHISTOCK.
        </h1>
        <form id="search-form" class="w-full max-w-md flex shadow-xl rounded-lg overflow-hidden mt-6">
            <input type="text" id="ticker-input" required placeholder="Enter Ticker (e.g. AAPL)" class="w-full px-6 py-4 text-lg border-none focus:outline-none focus:ring-2 focus:ring-blue-600 uppercase font-bold text-gray-700">
            <button type="submit" id="search-btn" class="px-8 bg-blue-600 text-white font-bold hover:bg-blue-700 transition flex items-center justify-center min-w-[120px]">
                Search
            </button>
        </form>
        <p id="error-message" class="text-red-500 mt-4 hidden font-semibold"></p>
    </header>

    <section id="dashboard" class="hidden px-6 md:px-10 max-w-5xl mx-auto">
        
        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mb-8 flex flex-col md:flex-row justify-between items-center md:items-end">
            <div>
                <h2 id="display-ticker" class="text-5xl font-black text-gray-900 tracking-tighter">AAPL</h2>
                <p class="text-sm font-bold text-gray-400 uppercase tracking-widest mt-1">Live Market Data</p>
            </div>
            <div class="text-right mt-6 md:mt-0">
                <h1 id="display-price" class="text-6xl font-light text-gray-900 mb-2">$0.00</h1>
                <div class="flex items-center justify-end space-x-3">
                    <span id="display-change" class="text-xl font-semibold">0.00</span>
                    <span id="display-pct" class="px-3 py-1 text-sm font-bold text-white rounded-full">0.00%</span>
                </div>
            </div>
        </div>

        <div class="bg-white p-8 rounded-2xl shadow-sm border border-gray-200 mb-8">
            <h3 class="text-lg font-bold text-gray-900 mb-4">1-Year Price Action</h3>
            <div id="price-chart" class="w-full h-80"></div>
        </div>

        <div class="bg-gray-900 p-8 md:p-12 rounded-2xl shadow-xl text-white">
            <h3 class="text-2xl font-black tracking-tight mb-8 text-center">Reverse DCF Engine</h3>
            
            <div class="grid grid-cols-1 md:grid-cols-4 gap-8 mb-10">
                <div class="flex flex-col">
                    <label class="text-gray-400 font-bold mb-2 text-xs uppercase tracking-widest">Proj Years</label>
                    <input type="number" id="proj-num" min="1" max="20" value="5" class="bg-gray-800 text-white rounded-lg p-2 mb-3 text-center font-bold outline-none border border-gray-700 focus:border-blue-500" oninput="document.getElementById('proj-sld').value = this.value; calculateDCF();">
                    <input type="range" id="proj-sld" min="1" max="20" value="5" class="w-full accent-blue-500" oninput="document.getElementById('proj-num').value = this.value; calculateDCF();">
                </div>
                <div class="flex flex-col">
                    <label class="text-gray-400 font-bold mb-2 text-xs uppercase tracking-widest">Growth (%)</label>
                    <input type="number" id="grow-num" min="1" max="100" value="15" step="0.5" class="bg-gray-800 text-white rounded-lg p-2 mb-3 text-center font-bold outline-none border border-gray-700 focus:border-blue-500" oninput="document.getElementById('grow-sld').value = this.value; calculateDCF();">
                    <input type="range" id="grow-sld" min="1" max="100" value="15" step="0.5" class="w-full accent-blue-500" oninput="document.getElementById('grow-num').value = this.value; calculateDCF();">
                </div>
                <div class="flex flex-col">
                    <label class="text-gray-400 font-bold mb-2 text-xs uppercase tracking-widest">Discount (%)</label>
                    <input type="number" id="disc-num" min="1" max="50" value="10" step="0.5" class="bg-gray-800 text-white rounded-lg p-2 mb-3 text-center font-bold outline-none border border-gray-700 focus:border-blue-500" oninput="document.getElementById('disc-sld').value = this.value; calculateDCF();">
                    <input type="range" id="disc-sld" min="1" max="50" value="10" step="0.5" class="w-full accent-blue-500" oninput="document.getElementById('disc-num').value = this.value; calculateDCF();">
                </div>
                <div class="flex flex-col">
                    <label class="text-gray-400 font-bold mb-2 text-xs uppercase tracking-widest">Exit Mult</label>
                    <input type="number" id="exit-num" min="1" max="100" value="15" step="1" class="bg-gray-800 text-white rounded-lg p-2 mb-3 text-center font-bold outline-none border border-gray-700 focus:border-blue-500" oninput="document.getElementById('exit-sld').value = this.value; calculateDCF();">
                    <input type="range" id="exit-sld" min="1" max="100" value="15" step="1" class="w-full accent-blue-500" oninput="document.getElementById('exit-num').value = this.value; calculateDCF();">
                </div>
            </div>

            <div class="flex flex-col md:flex-row justify-around items-center bg-gray-800 p-8 rounded-xl border border-gray-700 shadow-inner">
                <div class="text-center mb-6 md:mb-0">
                    <p class="text-gray-400 font-bold text-sm tracking-widest uppercase">Target Entry Price</p>
                    <h1 id="target-price" class="text-5xl md:text-6xl font-light text-white mt-2">$0.00</h1>
                </div>
                <div class="text-center">
                    <p class="text-gray-400 font-bold text-sm tracking-widest uppercase">Margin of Safety</p>
                    <h1 id="mos" class="text-5xl md:text-6xl font-bold mt-2">0.00%</h1>
                </div>
            </div>
            <p id="dcf-warning" class="text-red-400 text-center mt-6 hidden font-bold tracking-wide">Insufficient Cash Flow or Shares Data to run DCF Valuation.</p>
        </div>

    </section>

    <script>
        // Global variables to hold the math constants
        window.baseFCF = 0;
        window.baseShares = 0;
        window.basePrice = 0;

        const form = document.getElementById('search-form');
        const input = document.getElementById('ticker-input');
        const btn = document.getElementById('search-btn');
        const dashboard = document.getElementById('dashboard');
        const errorMsg = document.getElementById('error-message');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            const ticker = input.value.trim().toUpperCase();
            
            btn.innerHTML = 'Loading Engine...';
            btn.disabled = true;
            errorMsg.classList.add('hidden');
            dashboard.classList.add('hidden');

            try {
                // Fetch Data from your Render Server
                const response = await fetch(`https://sethistock-api.onrender.com/api/stock/${ticker}`);
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || "Ticker not found.");

                // 1. Inject Pricing Data
                document.getElementById('display-ticker').innerText = data.ticker;
                document.getElementById('display-price').innerText = `$${data.current_price.toFixed(2)}`;
                
                const changeEl = document.getElementById('display-change');
                const pctEl = document.getElementById('display-pct');
                const changeStr = data.change > 0 ? `+${data.change.toFixed(2)}` : data.change.toFixed(2);
                const pctStr = data.change > 0 ? `+${data.pct_change.toFixed(2)}%` : `${data.pct_change.toFixed(2)}%`;
                changeEl.innerText = changeStr;
                pctEl.innerText = pctStr;

                if (data.change >= 0) {
                    changeEl.className = "text-xl font-semibold text-green-600";
                    pctEl.className = "px-3 py-1 text-sm font-bold text-white rounded-full bg-green-500";
                } else {
                    changeEl.className = "text-xl font-semibold text-red-600";
                    pctEl.className = "px-3 py-1 text-sm font-bold text-white rounded-full bg-red-500";
                }

                // 2. Draw Plotly Chart
                if(data.chart_dates.length > 0) {
                    const trace = {
                        x: data.chart_dates,
                        y: data.chart_closes,
                        type: 'scatter',
                        mode: 'lines',
                        line: {color: '#2563eb', width: 2.5},
                        fill: 'tozeroy',
                        fillcolor: 'rgba(37, 99, 235, 0.05)'
                    };
                    const layout = {
                        margin: {t: 10, b: 30, l: 40, r: 10},
                        xaxis: {showgrid: false, fixedrange: true},
                        yaxis: {showgrid: true, gridcolor: '#f1f5f9', fixedrange: true},
                        plot_bgcolor: 'transparent',
                        paper_bgcolor: 'transparent'
                    };
                    Plotly.newPlot('price-chart', [trace], layout, {displayModeBar: false, responsive: true});
                }

                // 3. Initialize DCF Math
                window.baseFCF = data.fcf;
                window.baseShares = data.shares;
                window.basePrice = data.current_price;
                calculateDCF(); // Run the math immediately

                dashboard.classList.remove('hidden');

            } catch (error) {
                errorMsg.innerText = error.message;
                errorMsg.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Search';
                btn.disabled = false;
            }
        });

        // Instant DCF Math Engine
        function calculateDCF() {
            const projYears = parseInt(document.getElementById('proj-num').value);
            const growthRate = parseFloat(document.getElementById('grow-num').value) / 100;
            const discountRate = parseFloat(document.getElementById('disc-num').value) / 100;
            const exitMult = parseFloat(document.getElementById('exit-num').value);
            
            const warning = document.getElementById('dcf-warning');
            const targetEl = document.getElementById('target-price');
            const mosEl = document.getElementById('mos');

            if (window.baseFCF <= 0 || window.baseShares <= 0 || window.basePrice <= 0) {
                warning.classList.remove('hidden');
                targetEl.innerText = "N/A";
                mosEl.innerText = "N/A";
                mosEl.className = "text-5xl md:text-6xl font-bold mt-2 text-gray-500";
                return;
            }
            warning.classList.add('hidden');

            let fcf_n = window.baseFCF;
            let target_price_sum = 0;
            
            for(let t=1; t<=projYears; t++){
                fcf_n = fcf_n * (1 + growthRate);
                target_price_sum += fcf_n / Math.pow((1 + discountRate), t);
            }
            
            let tv = fcf_n * exitMult;
            target_price_sum += tv / Math.pow((1 + discountRate), projYears);
            
            let target_price_per_share = target_price_sum / window.baseShares;
            let margin_of_safety = ((target_price_per_share - window.basePrice) / window.basePrice) * 100;
            
            targetEl.innerText = '$' + target_price_per_share.toFixed(2);
            mosEl.innerText = margin_of_safety.toFixed(2) + '%';
            mosEl.className = margin_of_safety > 0 
                ? "text-5xl md:text-6xl font-bold mt-2 text-green-500" 
                : "text-5xl md:text-6xl font-bold mt-2 text-red-500";
        }
    </script>
</body>
</html>
